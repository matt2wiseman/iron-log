// Strip a leading zero as the user types (so "05" becomes "5"), while still
// permitting "0.5" and an empty field.
function wireNumFields(scope){
  (scope||document).querySelectorAll('.numfield').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      let v = inp.value.replace(/[^0-9.]/g,'');
      if(/^0[0-9]/.test(v)) v = v.replace(/^0+/,'');
      if(v.startsWith('.')) v = '0'+v;
      const parts = v.split('.');
      if(parts.length>2) v = parts[0]+'.'+parts.slice(1).join('');
      if(inp.value !== v) inp.value = v;
    });
  });
}

// Ticks update the row in place rather than re-rendering the whole tab, so a
// weight being typed in another row isn't wiped out mid-session.
function wireSetTicks(){
  document.querySelectorAll('[data-card] .settick').forEach(box=>{
    box.onchange = () => {
      const card = box.closest('[data-card]');
      if(!card) return;
      const exId = card.dataset.card;
      const rowCount = card.querySelectorAll('.setrow[data-set]').length;
      const idx = parseInt(box.dataset.tickidx,10);
      const on = toggleSetTick(exId, idx, rowCount);
      box.checked = on;
      const row = card.querySelector('.setrow[data-set="'+idx+'"]');
      if(row) row.classList.toggle('ticked', on);
      const prog = card.querySelector('.tick-progress');
      if(prog){
        const done = setTicksFor(exId, rowCount).filter(Boolean).length;
        const all = done === rowCount;
        prog.textContent = done ? done+'/'+rowCount+' sets ticked'+(all?' - ready to log':'') : '';
        prog.style.color = all ? GOOD : '#8B8F96';
      }
    };
  });
}

function readSetRows(card){
  return Array.from(card.querySelectorAll('.setrow[data-set]')).map(row=>({
    reps: parseFloat(row.querySelector('.f-reps')?.value) || 0,
    weight: parseFloat(row.querySelector('.f-weight')?.value) || 0,
  }));
}

function attachTodayHandlers(){
  wireNumFields();
  wireSetTicks();
  const cw = document.getElementById('change-week-link');
  if(cw) cw.onclick = () => { STATE.tab = "program"; render(); };

  document.querySelectorAll('[data-day]').forEach(b=>{
    b.onclick = () => { STATE.selectedDay = b.dataset.day; STATE.wodDraft=null; STATE.wodEditing=false; renderMain(); };
  });
  document.querySelectorAll('[data-section]').forEach(h=>{
    h.onclick = () => { const k=h.dataset.section; STATE.open[k]=!STATE.open[k]; renderMain(); };
  });

  // Set-based cards: log, update, or delete
  document.querySelectorAll('[data-card][data-extype="strength"], [data-card][data-extype="accessory"]').forEach(card=>{
    const ex = JSON.parse(card.dataset.exjson.replace(/&#39;/g,"'"));
    const isStrength = card.dataset.extype==="strength";
    const logId = card.dataset.logid;

    const logBtn = card.querySelector('.log-sets-btn');
    if(logBtn) logBtn.onclick = () => {
      const ok = isStrength ? logStrength(ex, readSetRows(card)) : logAccessory(ex, readSetRows(card));
      if(ok){ clearSetTicks(ex.id); renderMain(); }
    };

    const updBtn = card.querySelector('.update-sets-btn');
    if(updBtn && logId) updBtn.onclick = () => {
      if(updateSetLog(logId, { ...ex, type: card.dataset.extype }, readSetRows(card))) renderMain();
    };

    const delBtn = card.querySelector('.delete-log-btn');
    if(delBtn && logId) delBtn.onclick = () => {
      if(confirm(`Delete this ${ex.name} entry?`)){ deleteLog(logId); renderMain(); }
    };
  });

  // Text-result cards: log, update, or delete
  document.querySelectorAll('[data-card][data-extype="skill"], [data-card][data-extype="conditioning"]').forEach(card=>{
    const ex = JSON.parse(card.dataset.exjson.replace(/&#39;/g,"'"));
    const input = card.querySelector('.result-input');
    const logId = card.dataset.logid;

    const logBtn = card.querySelector('.log-text-btn');
    if(logBtn) logBtn.onclick = () => {
      if(!input.value.trim()) return;
      if(card.dataset.extype==="skill") logSkill(ex, input.value.trim());
      else logConditioning(ex, input.value.trim());
      renderMain();
    };

    const updBtn = card.querySelector('.update-text-btn');
    if(updBtn && logId) updBtn.onclick = () => {
      if(updateTextLog(logId, input.value)) renderMain();
    };

    const delBtn = card.querySelector('.delete-log-btn');
    if(delBtn && logId) delBtn.onclick = () => {
      if(confirm(`Delete this ${ex.name} entry?`)){ deleteLog(logId); renderMain(); }
    };
  });

  attachWodHandlers();

  const copyBtn = document.getElementById('copy-whoop-btn');
  if(copyBtn && !copyBtn.disabled){
    copyBtn.onclick = async () => {
      const text = buildDayWhoopText(STATE.selectedDay, STATE.logs, STATE.journal, STATE.dayWods[STATE.selectedDay]);
      if(!text) return;
      if(await copyToClipboard(text)){
        copyBtn.classList.add('copied');
        document.getElementById('copy-whoop-label').textContent = "Copied";
        setTimeout(()=>{ renderMain(); }, 1600);
      }
    };
  }
}

function attachWodHandlers(){
  const day = STATE.selectedDay;
  const parseBtn = document.getElementById('wod-parse-btn');
  const rawEl = document.getElementById('wod-raw');
  const errEl = document.getElementById('wod-error');

  if(parseBtn && rawEl){
    parseBtn.onclick = async () => {
      const raw = rawEl.value;
      if(!raw.trim()) return;
      STATE.wodParsing = true;
      parseBtn.textContent = "Reading..."; parseBtn.disabled = true; errEl.textContent = '';
      try{
        const p = await parseWodWithClaude(raw);
        p.rawText = raw;
        p.movements = (p.movements||[]).map(m=>({ ...m, load: m.load ?? '' }));
        STATE.wodDraft = p;
        STATE.wodParsing = false;
        renderMain();
      }catch(e){
        STATE.wodParsing = false;
        errEl.textContent = (e.message||"Couldn't read that") + " - you can still save it as raw text.";
        parseBtn.textContent = "Read & Break Down"; parseBtn.disabled = false;
      }
    };
  }

  const skipBtn = document.getElementById('wod-skip-btn');
  if(skipBtn && rawEl){
    skipBtn.onclick = () => {
      if(!rawEl.value.trim()) return;
      saveDayWod(day, { title:"Custom WOD", format:null, timeCap:null, movements:[], rawText:rawEl.value, result:"" });
    };
  }

  const saveBtn = document.getElementById('wod-save-btn');
  if(saveBtn){
    saveBtn.onclick = () => {
      const d = STATE.wodDraft; if(!d) return;
      const moves = (d.movements||[]).map((m,i)=>{
        const row = document.querySelector(`.setrow[data-move="${i}"] .f-load`);
        return { ...m, load: row ? row.value : (m.load||'') };
      });
      const result = document.getElementById('wod-result')?.value || "";
      saveDayWod(day, { ...d, movements:moves, result });
    };
  }

  const editBtn = document.getElementById('wod-edit-btn');
  if(editBtn) editBtn.onclick = () => {
    const w = STATE.dayWods[day];
    STATE.wodDraft = w && (w.movements||[]).length ? { ...w } : null;
    STATE.wodEditing = true; renderMain();
  };
  const cancelBtn = document.getElementById('wod-cancel-edit');
  if(cancelBtn) cancelBtn.onclick = () => { STATE.wodEditing=false; STATE.wodDraft=null; renderMain(); };

  const clearBtn = document.getElementById('wod-clear-btn');
  if(clearBtn) clearBtn.onclick = () => {
    const next = { ...STATE.dayWods }; delete next[day];
    persistDayWods(next); STATE.wodDraft=null; STATE.wodEditing=false; renderMain();
  };

  const histBtn = document.getElementById('wod-history-btn');
  if(histBtn) histBtn.onclick = () => {
    const w = STATE.dayWods[day]; if(!w) return;
    persistLogs([{ id:uid(), date:new Date().toISOString(), day, type:"customWod",
      title:w.title, format:w.format, timeCap:w.timeCap, movements:w.movements,
      rawText:w.rawText, result:w.result }, ...STATE.logs]);
    persistDayWods({ ...STATE.dayWods, [day]: { ...w, savedToHistory:true } });
    renderMain();
  };
}

function saveDayWod(day, wod){
  persistDayWods({ ...STATE.dayWods, [day]: { ...wod, savedAt: new Date().toISOString(), savedToHistory:false } });
  STATE.wodDraft = null; STATE.wodEditing = false;
  renderMain();
}

function switchProgram(key){
  if(!PROGRAMS[key] || key === STATE.programKey) return;
  STATE.programKey = key;
  saveKey("settings", { programKey: STATE.programKey, blockWeeks: STATE.blockWeeks });
  // Seed any day this program hasn't run before; days it has run keep their
  // place, so switching back resumes mid-block rather than restarting.
  seedProgramSlots(key);
  const r = realignSlotsAfterTests(STATE.slotState, STATE.logs);
  if(r.changed){ STATE.slotState = r.slotState; saveKey("slotState", r.slotState); }
  // Selected day may not exist as a training day in the new program.
  STATE.wodDraft = null; STATE.wodEditing = false;
  renderMain();
}

function setBlockWeeks(n){
  const v = Math.min(MAX_BLOCK_WEEKS, Math.max(MIN_BLOCK_WEEKS, parseInt(n,10)||DEFAULT_BLOCK_WEEKS));
  if(v === STATE.blockWeeks) return;
  STATE.blockWeeks = v;
  saveKey("settings", { programKey: STATE.programKey, blockWeeks: v });
  // Changing block length moves every test week, so re-space them.
  respaceAllSlots();
  renderMain();
}

// Put a cycle (one lift, or a synced program's shared cycle) at a chosen week.
// Week N means this calendar week becomes week N. Any tests already logged
// are marked as accounted for, so realignment can't override the choice, and
// the delete-undo trail is cleared so deleting an old test won't undo it.
function setCycleWeek(slot, week){
  const prog = activeProgram();
  const total = blockWeekCount();
  const w = Math.min(total, Math.max(1, parseInt(week,10) || 1));
  const key = prog.syncedTesting ? "__cycle" : slot;
  const slots = { ...slotsFor(prog.key) };
  const st = slots[key];
  if(!st) return false;
  const latestTest = STATE.logs
    .filter(l => l.isTest && l.programKey === prog.key && (prog.syncedTesting || l.slot === slot))
    .sort((a,b)=> new Date(b.date) - new Date(a.date))[0];
  const thisWeek = startOfWeekSunday(new Date());
  slots[key] = { ...st,
    startDate: new Date(thisWeek.getTime() - (w-1)*MS_WEEK).toISOString(),
    lastTestLogId: latestTest ? latestTest.id : (st.lastTestLogId || null),
    testedWeek: null, prevStartDate: null, prevTestLogId: null, prevTestedWeek: null,
    manualSetAt: new Date().toISOString() };
  STATE.slotState = { ...STATE.slotState, [prog.key]: slots };
  saveKey("slotState", STATE.slotState);
  return true;
}

// Lifts in a staggered program whose test weeks now coincide.
function testWeekClashes(prog){
  if(prog.syncedTesting) return [];
  const total = blockWeekCount();
  const slots = slotsFor(prog.key);
  const byWeek = {};
  programLiftKeys(prog).forEach(k=>{
    if(!slots[k]) return;
    const wk = projectedTestWeek(slots[k].startDate, total).getTime();
    (byWeek[wk] = byWeek[wk] || []).push(k);
  });
  return Object.values(byWeek).filter(g => g.length > 1);
}

function weekPills(slot, current, total){
  let h = `<div class="pill-row" style="margin:6px -16px 0;padding-bottom:2px">`;
  for(let n=1; n<=total; n++){
    h += `<button class="pill ${n===current?'active':''}" data-setweek="${n}" data-slot="${slot}"
      style="padding:5px 11px">${n===total ? `${n} test` : n}</button>`;
  }
  return h + `</div>`;
}

function renderWeekControl(prog){
  const total = blockWeekCount();
  if(prog.syncedTesting){
    const pos = cyclePosition(prog, null);
    return `<div class="card sub" style="margin-bottom:12px">
      <div class="small" style="font-weight:500">Cycle week ${pos.weekInBlock} of ${pos.totalWeeks}${pos.testWeek ? ' - test week' : ''}</div>
      <div class="xsmall muted" style="margin-top:3px">${pos.testWeek ? 'Maxes this week.' : `Maxes in ${pos.totalWeeks - pos.weekInBlock} week${pos.totalWeeks - pos.weekInBlock === 1 ? '' : 's'}.`}
        Missed a week? Tap the week you want to be on - every lift moves together.</div>
      ${weekPills("__cycle", pos.weekInBlock, total)}
    </div>`;
  }
  let h = `<div class="card sub" style="margin-bottom:12px">
    <div class="small" style="font-weight:500">Cycle weeks</div>
    <div class="xsmall muted" style="margin-top:3px">Missed a week? Tap the week each lift should be on.</div>`;
  programLiftKeys(prog).sort((a,b)=> firstDayOf(prog,a) - firstDayOf(prog,b)).forEach(k=>{
    const b = liftBlock(prog, k);
    const pos = cyclePosition(prog, k);
    h += `<div style="margin-top:10px"><div class="xsmall" style="color:#d6d3d1">${esc(b ? b.name : k)} - week ${pos.weekInBlock}/${pos.totalWeeks}</div>
      ${weekPills(k, pos.weekInBlock, total)}</div>`;
  });
  const clashes = testWeekClashes(prog);
  if(clashes.length){
    const names = clashes.map(g => g.map(k => (liftBlock(prog,k)||{}).name || k).join(" and ")).join("; ");
    h += `<div class="xsmall accent" style="margin-top:10px">Heads up: ${esc(names)} now test in the same week.</div>`;
  }
  return h + `</div>`;
}

// After a block-length change, keep each cycle at its current position
// (clamped to the new length) and re-space staggered test weeks so none collide.
function respaceAllSlots(){
  const prog = activeProgram();
  const total = blockWeekCount();
  const thisWeek = startOfWeekSunday(new Date());
  const slots = { ...slotsFor(prog.key) };
  const keys = prog.syncedTesting ? ["__cycle"]
    : programLiftKeys(prog).sort((a,b)=> firstDayOf(prog,a) - firstDayOf(prog,b));
  keys.forEach(k=>{
    const st = slots[k];
    if(!st) return;
    const startWeek = startOfWeekSunday(new Date(st.startDate));
    if(startWeek > thisWeek) return;   // next cycle already scheduled - leave it
    const elapsed = Math.round((thisWeek - startWeek) / MS_WEEK);
    const pos = Math.min(Math.max(0, elapsed), total - 1);
    let start = new Date(thisWeek.getTime() - pos * MS_WEEK);
    if(!prog.syncedTesting) start = avoidTestCollision(k, start, slots, prog);
    slots[k] = { ...st, startDate: start.toISOString() };
  });
  STATE.slotState = { ...STATE.slotState, [prog.key]: slots };
  saveKey("slotState", STATE.slotState);
}

function attachProgramHandlers(){
  document.querySelectorAll('[data-progpick]').forEach(c=>{
    c.onclick = () => switchProgram(c.dataset.progpick);
  });
  document.querySelectorAll('[data-weeks]').forEach(b=>{
    b.onclick = () => setBlockWeeks(b.dataset.weeks);
  });
  document.querySelectorAll('[data-setweek]').forEach(b=>{
    b.onclick = () => {
      const prog = activeProgram();
      const w = parseInt(b.dataset.setweek,10);
      const slot = b.dataset.slot;
      const name = prog.syncedTesting ? "the whole cycle" : ((liftBlock(prog, slot)||{}).name || "this lift");
      if(confirm(`Move ${name} to week ${w}? This week becomes week ${w}.`)){
        setCycleWeek(slot, w);
        renderMain();
      }
    };
  });
}

function attachLiftsHandlers(){
  wireNumFields();
  document.querySelectorAll('.edit-lift-btn').forEach(btn=>{
    btn.onclick = () => {
      STATE.editingLift = STATE.editingLift === btn.dataset.lift ? null : btn.dataset.lift;
      renderMain();
      document.querySelector('.lift-edit-input')?.focus();
    };
  });
  document.querySelectorAll('.lift-edit-input').forEach(input=>{
    input.onblur = () => { update1RM(input.dataset.lift, input.value); STATE.editingLift=null; renderMain(); };
    input.onkeydown = (e) => { if(e.key==='Enter') input.blur(); };
  });
}

function attachLogHandlers(){
  document.querySelectorAll('[data-logsub]').forEach(b=>{
    b.onclick = () => { STATE.logSubTab = b.dataset.logsub; renderMain(); };
  });
  if(STATE.logSubTab==="history"){
    const res = document.getElementById('log-results');
    const paint = () => {
      res.innerHTML = renderLogResults();
      res.querySelectorAll('.hist-del-btn').forEach(b=>{
        b.onclick = () => {
          const entry = STATE.logs.find(l=>l.id===b.dataset.logid);
          if(entry && confirm(`Delete this ${logName(entry)} entry?`)){ deleteLog(b.dataset.logid); paint(); }
        };
      });
    };
    paint();
    const s = document.getElementById('log-search');
    s.oninput = () => { STATE.logSearch = s.value; paint(); };
  } else {
    const add = document.getElementById('journal-add-btn');
    const inp = document.getElementById('journal-input');
    const go = () => { addJournal(inp.value); inp.value=''; renderMain(); };
    add.onclick = go;
    inp.onkeydown = (e) => { if(e.key==='Enter') go(); };
  }
}

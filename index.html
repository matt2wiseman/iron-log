<script>
// ============================================================
// Constants
// ============================================================

const DAY_ORDER = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];

const LIFT_LABELS = {
  squat:"Back Squat", frontSquat:"Front Squat", overheadSquat:"Overhead Squat",
  deadlift:"Deadlift", sumoDeadlift:"Sumo Deadlift",
  bench:"Bench Press", ohp:"Strict Press", pushPress:"Push Press", pushJerk:"Push Jerk", splitJerk:"Split Jerk",
  snatch:"Snatch", powerSnatch:"Power Snatch", hangSnatch:"Hang Snatch",
  clean:"Clean", powerClean:"Power Clean", hangClean:"Hang Clean", cleanAndJerk:"Clean & Jerk",
  thruster:"Thruster", hipThrust:"Hip Thrust", weightedPullup:"Weighted Pull-up (added kg)",
};

const LIFT_GROUPS = [
  { title:"Squat", lifts:["squat","frontSquat","overheadSquat"] },
  { title:"Deadlift", lifts:["deadlift","sumoDeadlift"] },
  { title:"Press", lifts:["bench","ohp","pushPress","pushJerk","splitJerk"] },
  { title:"Snatch", lifts:["snatch","powerSnatch","hangSnatch"] },
  { title:"Clean", lifts:["clean","powerClean","hangClean","cleanAndJerk"] },
  { title:"Other", lifts:["thruster","hipThrust","weightedPullup"] },
];

const LIFT_INCREMENT = {
  squat:5, frontSquat:2.5, overheadSquat:2.5, deadlift:5, sumoDeadlift:5,
  bench:2.5, ohp:2.5, pushPress:2.5, pushJerk:2.5, splitJerk:2.5,
  snatch:1, powerSnatch:1, hangSnatch:1,
  clean:2.5, powerClean:2.5, hangClean:2.5, cleanAndJerk:2.5,
  thruster:2.5, hipThrust:5, weightedPullup:2.5,
};

const DEFAULT_ONE_RMS = Object.keys(LIFT_LABELS).reduce((acc,key)=>{
  acc[key] = key==="squat"?120 : key==="bench"?100 : key==="deadlift"?140 : key==="ohp"?60 : 0;
  return acc;
},{});

// ---------- Blocks as phases, not fixed week lists ----------
// A block describes the SHAPE of a progression: an ordered set of phases, each
// with its own rep scheme, intensity range and execution cue, plus a `share`
// saying roughly how much of the block it should occupy. The week list is then
// generated for whatever block length is chosen (5-10 weeks), so the coaching
// intent survives at any length instead of being stretched into nonsense.

function slugify(name){
  return String(name||"").toLowerCase().replace(/\(.*?\)/g,"")
    .replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
}

// Spread `total` weeks across phases in proportion to their share, giving every
// phase at least one week and handing any remainder to the largest shares.
function distributeWeeks(phases, total){
  const sumShare = phases.reduce((a,p)=>a+(p.share||1),0);
  let alloc = phases.map(p => Math.max(1, Math.floor((p.share||1)/sumShare*total)));
  let used = alloc.reduce((a,b)=>a+b,0);
  while(used > total){
    const i = alloc.indexOf(Math.max(...alloc));
    if(alloc[i] <= 1) break;
    alloc[i]--; used--;
  }
  const order = phases.map((p,i)=>({i,share:p.share||1})).sort((a,b)=>b.share-a.share);
  let k = 0;
  while(used < total){ alloc[order[k % order.length].i]++; used++; k++; }
  return alloc;
}

// Concrete week-by-week prescription for a block of `totalWeeks`. The final
// week is always the test; everything before it is working weeks.
// Fraction of 1RM you can lift for `reps` (inverse Epley).
function repPct(reps){ return 1/(1 + reps/30); }
// Reps in reserve implied by a load, after undoing any pause/tempo factor.
function rirFromPct(pct, reps, loadFactor){
  const eff = pct / (loadFactor || 1);
  if(!(eff > 0)) return null;
  return Math.max(0, Math.round((30*(1/eff - 1) - reps) * 2) / 2);
}

// Concrete week-by-week prescription for a block of `totalWeeks`. The final
// week is always the test; everything before it is working weeks.
// Blocks with a `rir` curve set heavy loads from reps-in-reserve: the target
// tightens from rir.start in week 1 to rir.end in the last working week, eased
// so most of the tightening lands late in the block. Load is then whatever you
// can lift for (reps + reserve), scaled down for paused or tempo work.
function generateWeeks(block, totalWeeks){
  const working = Math.max(1, totalWeeks - 1);
  const alloc = distributeWeeks(block.phases, working);
  const weeks = [];
  let w = 1;
  block.phases.forEach((ph, pi)=>{
    const n = alloc[pi];
    for(let j=0;j<n;j++){
      const sets = Array.isArray(ph.sets) ? ph.sets[Math.min(j, ph.sets.length-1)] : ph.sets;
      const reps = Array.isArray(ph.reps) ? ph.reps[Math.min(j, ph.reps.length-1)] : ph.reps;
      let pct, rir = null;
      if(block.rir){
        const t = working === 1 ? 1 : (w-1)/(working-1);
        rir = block.rir.start + (block.rir.end - block.rir.start) * Math.pow(t, 1.5);
        pct = repPct(reps + rir) * (ph.loadFactor || 1);
        rir = Math.round(rir*2)/2;
      } else {
        const t = n === 1 ? 0 : j/(n-1);
        pct = ph.pctEnd === undefined ? ph.pctStart : ph.pctStart + (ph.pctEnd - ph.pctStart)*t;
      }
      weeks.push({ week: w++, sets, reps, pct: Math.round(pct*1000)/1000, rir,
                   loadFactor: ph.loadFactor || 1, style: ph.style });
    }
  });
  weeks.push({ week: w, sets: block.test.sets, reps: block.test.reps, pct: block.test.pct,
               style: block.test.style, isTest: true });
  return weeks;
}

// Skill blocks are prescriptions in words, so they scale by repeating stages
// rather than interpolating a percentage.
function generateSkillWeeks(block, totalWeeks){
  const working = Math.max(1, totalWeeks - 1);
  const alloc = distributeWeeks(block.stages.map(s=>({share:s.share||1})), working);
  const weeks = [];
  let w = 1;
  block.stages.forEach((st, si)=>{
    for(let j=0;j<alloc[si];j++) weeks.push({ week: w++, prescription: st.prescription });
  });
  weeks.push({ week: w, prescription: block.test.prescription, isTest: true });
  return weeks;
}

function blockWeeks(block, totalWeeks){
  return block.type === "skill" ? generateSkillWeeks(block, totalWeeks) : generateWeeks(block, totalWeeks);
}

// ---------- Block library ----------

const BLOCKS = {

  },

      {sets:4, reps:8, share:2, style:"Full lockout, ribs down"},
      {sets:3, reps:6, share:1, style:"Heavy, still full lockout"},
    ],

  },
  strictPressVolume: {
    key:"strictPressVolume", label:"Volume Accumulation", type:"barbell", lift:"ohp",
    name:"Strict Press", testType:"1rm", rir:{ start:6.5, end:0.5 },
    phases:[
      {sets:5, reps:8, share:1, style:"Strict - no leg drive, no layback"},
      {sets:5, reps:[6,5], share:2, style:"Strict, brace hard, full lockout"},
      {sets:4, reps:4, share:1, style:"Strict, reset each rep at the shoulder"},
      {sets:3, reps:2, share:1, style:"Heavy doubles"},
    ],

  },
  deadliftCluster: {
    key:"deadliftCluster", label:"Cluster Loading", type:"barbell", lift:"deadlift",
    name:"Deadlift", testType:"1rm", rir:{ start:5.5, end:1 },
    phases:[
      {sets:4, reps:5, share:1, style:"Straight sets, dead stop each rep"},
      {sets:5, reps:3, share:1, style:"Cluster: 3 reps, 20s rest, repeat"},
      {sets:[5,6], reps:2, share:2, style:"Cluster: 2 reps, 30s rest, repeat"},
      {sets:3, reps:1, share:1, style:"Cluster singles, 30s rest between"},
    ],
    test:{sets:1, reps:1, pct:0.95, style:"Build to a max single"},
  },
  // Added-load lift: bodyweight is part of what's lifted, so a percentage of
  // the added-weight max would prescribe nonsense. Load progresses from the
  // last session instead, and only a genuine test single sets the max.
  weightedPullup: {
    key:"weightedPullup", label:"Weighted Progression", type:"barbell", lift:"weightedPullup",
    name:"Weighted Pull-up", testType:"1rm", loadMode:"progression", prFromTestOnly:true,
    phases:[
      {sets:4, reps:6, pctStart:0, share:2, style:"Dead hang to chin over bar, every rep clean"},
      {sets:4, reps:4, pctStart:0, share:2, style:"Heavier - strict, no kip"},
      {sets:3, reps:3, pctStart:0, share:1, style:"Heavy triples, full range"},
    ],
    test:{sets:1, reps:1, pct:0, style:"Max added weight for one strict rep"},
  },
  hspuSkill: {
    key:"hspuSkill", label:"Gymnastics Skill Progression", type:"skill",
    name:"Handstand Push-up",
    stages:[
      {share:1, prescription:"Wall-facing Handstand Hold 5 x 30-45s + Pike Push-up 4 x 8"},
      {share:1, prescription:"Wall-facing Handstand Hold 5 x 45-60s + Deficit Pike Push-up 4 x 10"},
      {share:1, prescription:"Kick-up to Handstand practice 8 attempts + Negative HSPU 4 x 3"},
      {share:1, prescription:"Strict HSPU singles/doubles with light assistance, 5 sets"},
      {share:1, prescription:"Strict HSPU 4 x 3-5 unbroken, minimal assistance"},

// ---------- Programs ----------
// A program names its lifts (each running one block) and lays out the week
// as sessions of those lifts. A lift can appear on several days with a
// heavy / medium / light role, which is how high-frequency training spreads
// weekly volume without every session being hard.
//
// syncedTesting: every lift runs one shared cycle and tests in the same week
// (on the program's testDays). Otherwise each lift cycles independently and
// test weeks are staggered so no two land together.

function acc(name, sets, reps, detail, extra){
  return { name, sets, reps, detail, type:"accessory", movement:slugify(name), ...(extra||{}) };
}

const PROGRAMS = {

    },

    syncedTesting:true,

    },

      Monday:    { kind:"strength", sessions:[
                    {lift:"frontSquat", role:"heavy"}, {lift:"bench", role:"medium"}, {lift:"ohp", role:"heavy"} ],
                   accessories:[

const DEFAULT_PROGRAM_KEY = "crossfit";
const MIN_BLOCK_WEEKS = 5, MAX_BLOCK_WEEKS = 10, DEFAULT_BLOCK_WEEKS = 6;

function activeProgram(){ return PROGRAMS[STATE.programKey] || PROGRAMS[DEFAULT_PROGRAM_KEY]; }
function blockWeekCount(){
  const n = STATE.blockWeeks || DEFAULT_BLOCK_WEEKS;
  return Math.min(MAX_BLOCK_WEEKS, Math.max(MIN_BLOCK_WEEKS, n));
}

// Namespaced, stable ids.
function exId(programKey, day, slot){ return `${programKey}:${day}:${slot}`; }
function accId(programKey, day, name){ return `${programKey}:${day}:acc:${slugify(name)}`; }

function programLiftKeys(prog){ return Object.keys(prog.lifts || {}); }
function liftBlock(prog, slot){
  const l = prog.lifts && prog.lifts[slot];
  return l ? BLOCKS[l.block] : null;
}
// How many sessions a week a lift appears in this program.
function liftFrequency(prog, slot){
  return DAY_ORDER.reduce((n,d)=> n + ((prog.days[d] && prog.days[d].sessions) || []).filter(s=>s.lift===slot).length, 0);
}
function firstDayOf(prog, slot){
  const i = DAY_ORDER.findIndex(d=> ((prog.days[d] && prog.days[d].sessions) || []).some(s=>s.lift===slot));
  return i < 0 ? 99 : i;
}

function dayConfig(day){ return activeProgram().days[day] || { focus:"Rest" }; }

function dayConditioning(day){
  const prog = activeProgram();
  const cfg = prog.days[day];
  if(!cfg || !cfg.conditioning) return null;
  return { ...cfg.conditioning, type:"conditioning", movement:slugify(cfg.conditioning.name),
           id: exId(prog.key, day, "cond"), programKey: prog.key };
}

const ACCENT = "#E4572E", GOOD = "#7FB069";

// ============================================================
// Weight-relevance detection
// ============================================================
// Machines, runs and bodyweight gymnastics don't take a load, so their
// weight field is suppressed rather than showing an empty box to skip past.

const NO_WEIGHT_PATTERNS = [
  "run","running","row","rowing","erg","bike","bikeerg","assault bike","echo bike","ski","skierg",
  "swim","jump rope","double under","double-under","single under","skip",
  "burpee","push-up","pushup","push up","sit-up","situp","sit up","air squat","pistol",
  "pull-up","pullup","pull up","chin-up","chinup","toes-to-bar","toes to bar","t2b",
  "muscle-up","muscle up","handstand","hspu","ring dip","dip","box jump","box step",
  "mountain climber","plank","hollow","v-up","crunch","lunge walk","bear crawl",
  "broad jump","tuck jump","star jump","ring row","inverted row",
];

// These override the above - e.g. "weighted pull-up" DOES take load.
const FORCE_WEIGHT_PATTERNS = ["weighted","dumbbell","db ","kettlebell","kb ","barbell","loaded","goblet","wall ball","wallball","med ball","medicine ball","sandbag","plate",
  "farmer","sled","yoke","chest-supported","chest supported","bent-over","bent over","pendlay","seal row","cable","t-bar","landmine","upright row"];

// A movement takes load unless it's a machine, a run, or bodyweight
// gymnastics - with an override list so "weighted pull-up" still asks for kg.
function needsWeight(name){
  if(!name) return true;
  const n = String(name).toLowerCase().trim();
  if(FORCE_WEIGHT_PATTERNS.some(f=>n.includes(f))) return true;
  if(NO_WEIGHT_PATTERNS.some(p=>n.includes(p))) return false;
  return true;
}

const STORE_PREFIX = "ironlog:";
async function loadKey(key, fallback){
  try{
    const raw = localStorage.getItem(STORE_PREFIX + key);
    return raw === null ? fallback : JSON.parse(raw);
  }catch{ return fallback; }
}
async function saveKey(key, value){
  try{ localStorage.setItem(STORE_PREFIX + key, JSON.stringify(value)); } catch{}
}

// Monotonic unique id. Date.now() alone collides when two entries are saved
// in the same millisecond, which would make delete-by-id remove both.
let _uidSeq = 0;
function uid(){ _uidSeq = (_uidSeq + 1) % 100000; return `${Date.now()}-${_uidSeq}`; }

function round25(n){ return Math.round(n/2.5)*2.5; }
// Epley estimates a max from a multi-rep set. A single IS the max, so it must
// not be inflated - Epley applied to 1 rep adds ~3.3%.
function epley1RM(w,r){ if(!w||!r) return 0; return r <= 1 ? w : w*(1+r/30); }

// Earlier builds ran Epley on singles too, recording every true 1RM ~3.3% high.
// Where a max still equals the inflated figure from a single-rep PR, bring it
// back to the weight actually lifted. Values set by hand are left alone.
function correctInflatedSingles(oneRMs, prs){
  const next = { ...oneRMs };
  const fixedPrs = prs.map(p => ({ ...p }));
  let changed = false;
  const byLift = {};
  fixedPrs.forEach(p=>{ if(!byLift[p.lift] || new Date(p.date) > new Date(byLift[p.lift].date)) byLift[p.lift] = p; });
  fixedPrs.forEach(p=>{
    if(p.reps === 1 && p.weight && Math.round(p.estOneRM) === Math.round(p.weight*(1+1/30))){
      const current = byLift[p.lift] === p && Math.round(next[p.lift]) === Math.round(p.estOneRM);
      p.estOneRM = p.weight;
      changed = true;
      if(current) next[p.lift] = p.weight;
    }
  });
  return { oneRMs: next, prs: fixedPrs, changed };
}
function todayName(){ return DAY_ORDER[(new Date().getDay()+6)%7]; }
function fmtDate(d){ return new Date(d).toLocaleDateString(undefined,{month:"short",day:"numeric"}); }
function esc(s){ const d=document.createElement('div'); d.textContent = s==null?"":String(s); return d.innerHTML; }
function escAttr(obj){ return esc(JSON.stringify(obj)).replace(/'/g,'&#39;'); }

// Training week runs Sunday 23:00 -> Sunday 23:00. Everything logged or saved
// inside that window belongs to the same week, so a missed Tuesday can be done
// Thursday and still count as that week's Tuesday session.
function weekBoundary(ref){
  const d = new Date(ref || Date.now());
  const b = new Date(d);
  b.setHours(23,0,0,0);
  // Step back to the most recent Sunday 23:00 that has already passed.
  const daysSinceSunday = b.getDay(); // Sun = 0
  b.setDate(b.getDate() - daysSinceSunday);
  if(b > d) b.setDate(b.getDate() - 7);
  return b;
}
function isThisTrainingWeek(dateISO){
  return new Date(dateISO) >= weekBoundary();
}

function startOfWeekSunday(d){
  const x = new Date(d); x.setHours(0,0,0,0);
  x.setDate(x.getDate() - x.getDay());
  return x;
}

// ---------- Cycle engine ----------
// Cycle state lives at STATE.slotState[programKey]. Staggered programs keep one
// entry per lift; synced programs keep a single shared `__cycle` entry.
// Namespacing per program means switching away and back resumes each lift
// where it was rather than restarting it.

const MS_WEEK = 7*24*60*60*1000;

function slotsFor(programKey){
  return (STATE.slotState && STATE.slotState[programKey]) || {};
}

function cycleStateFor(prog, slot, progSlots){
  const slots = progSlots || slotsFor(prog.key);
  return prog.syncedTesting ? slots.__cycle : slots[slot];
}

// Where a lift (or a synced program's shared cycle) sits right now.
function cyclePosition(prog, slot, progSlots){
  const total = blockWeekCount();
  const st = cycleStateFor(prog, slot, progSlots);
  if(!st) return { weekInBlock:1, totalWeeks:total, complete:false, testWeek:false };
  const thisWeek = startOfWeekSunday(new Date());
  const startWeek = startOfWeekSunday(new Date(st.startDate));
  if(startWeek > thisWeek){
    // Next cycle is already scheduled. If that's because a test was logged
    // this week, the rest of the week is still that test week - so the logged
    // test stays visible and editable. Otherwise the lift simply hasn't
    // started yet (a staggered seed pushed it back) and shows week 1.
    if(st.testedWeek && new Date(st.testedWeek).getTime() === thisWeek.getTime()){
      return { weekInBlock: total, totalWeeks: total, complete:false, testWeek:true, justTested:true };
    }
    return { weekInBlock:1, totalWeeks:total, complete:false, testWeek:false };
  }
  const weekNumber = Math.round((thisWeek - startWeek) / MS_WEEK) + 1;
  const weekInBlock = Math.min(weekNumber, total);
  return { weekInBlock, totalWeeks: total, complete: weekNumber > total, testWeek: weekInBlock === total };
}

// The Sunday-anchored week a lift's final test week falls in.
function projectedTestWeek(startDateISO, totalWeeks){
  const n = (totalWeeks || blockWeekCount()) - 1;
  return new Date(startOfWeekSunday(new Date(startDateISO)).getTime() + n*MS_WEEK);
}

const ROLE_LABEL = { heavy:"Heavy", medium:"Medium", light:"Light", test:"Test" };

// Build one session's exercise from the lift's block and a role. Medium runs
// ~90% of the heavy load with one fewer set; light runs ~80% for 2-3 paused
// sets. Only the heavy session is meant to be genuinely hard.
function sessionExercise(prog, day, slot, role, pos){
  const block = liftBlock(prog, slot);
  if(!block) return null;
  const total = pos.totalWeeks;
  const weeks = blockWeeks(block, total);
  const base = {
    id: role === "test" ? exId(prog.key, day, slot) + ":test" : exId(prog.key, day, slot),
    slot, programKey: prog.key, role,
    name: block.name, movement: slugify(block.name),
    blockLabel: block.label, weekInBlock: pos.weekInBlock, totalWeeks: total, complete: !!pos.complete,
    testType: block.testType || "1rm", testReps: block.testReps || null,
    loadMode: block.loadMode || "percent", prFromTestOnly: !!block.prFromTestOnly,
  };

  // In a test week, sessions that aren't the test itself run off the
  // previous week's prescription rather than the test row.
  const workingWeek = pos.testWeek ? Math.max(1, total - 1) : pos.weekInBlock;

  if(block.type === "skill"){
    const row = role === "test" ? weeks[weeks.length-1] : (weeks.find(w=>w.week===workingWeek) || weeks[0]);
    return { ...base, type:"skill", prescription: row.prescription, isTest: role === "test" };
  }

  if(role === "test"){
    const t = weeks[weeks.length-1];
    return { ...base, type:"strength", lift:block.lift, sets:t.sets, reps:t.reps, pct:t.pct, style:t.style, isTest:true, rir:null };
  }

  const row = weeks.find(w=>w.week===workingWeek) || weeks[0];
  const factor = role === "medium" ? 0.9 : role === "light" ? 0.8 : 1;
  const sets = role === "heavy" ? row.sets
             : role === "medium" ? Math.max(2, row.sets - 1)
             : Math.max(2, Math.min(3, row.sets - 2));
  const pct = Math.round(row.pct * factor * 1000) / 1000;
  // Percentage-based blocks get a reps-in-reserve target for every role, so
  // medium and light days show how much easier they're meant to be.
  const rir = block.rir ? rirFromPct(pct, row.reps, row.loadFactor) : null;
  return {
    ...base, type:"strength", lift:block.lift, sets, reps:row.reps, pct, rir,
    style: role === "light" ? "Light - paused reps, crisp technique, stay 3-4 reps from failure" : row.style,
    isTest:false,
  };
}

// Test-week layout for a synced program: test days carry the maxes, every
// other session drops to light, and a lift trained only once a week skips its
// usual session because its test replaces it.
function isSyncedTestDay(prog, day, pos){
  return prog.syncedTesting && pos.testWeek && !!(prog.testDays||{})[day];
}

function buildDaySessions(day, progArg){
  const prog = progArg || activeProgram();
  const cfg = prog.days[day];
  if(!cfg) return [];
  const slots = slotsFor(prog.key);

  if(prog.syncedTesting){
    const pos = cyclePosition(prog, null, slots);
    if(pos.testWeek){
      const tests = (prog.testDays||{})[day];
      if(tests) return tests.map(slot => sessionExercise(prog, day, slot, "test", pos)).filter(Boolean);
      return (cfg.sessions||[])
        .filter(s => liftFrequency(prog, s.lift) > 1)
        .map(s => sessionExercise(prog, day, s.lift, "light", pos)).filter(Boolean);
    }
    return (cfg.sessions||[]).map(s => sessionExercise(prog, day, s.lift, s.role, pos)).filter(Boolean);
  }

  // Staggered: each lift is on its own cycle. In its test week the heavy
  // session becomes the test and anything else goes light.
  return (cfg.sessions||[]).map(s=>{
    const pos = cyclePosition(prog, s.lift, slots);
    const role = pos.testWeek ? (s.role === "heavy" ? "test" : "light") : s.role;
    return sessionExercise(prog, day, s.lift, role, pos);
  }).filter(Boolean);
}

// Accessories are skipped on a synced program's test days.
function dayAccessories(day, progArg){
  const prog = progArg || activeProgram();
  const cfg = prog.days[day];
  if(!cfg || !cfg.accessories) return [];
  if(prog.syncedTesting && isSyncedTestDay(prog, day, cyclePosition(prog, null))) return [];
  return cfg.accessories.map(a => ({ ...a, id: accId(prog.key, day, a.name), programKey: prog.key }));
}

// ---------- Realignment after tests ----------
// A cycle restarts from the week its test was actually done, not from when the
// calendar said it was due. The previous start is kept so deleting the test
// log that triggered a restart can put it back exactly.

function realignSlotsAfterTests(allSlotState, logs, programKey){
  const prog = programKey ? PROGRAMS[programKey] : activeProgram();
  const slots = { ...(allSlotState[prog.key] || {}) };
  let changed = false;

  // Tests logged before a manual week change are history, not a signal to
  // restart - otherwise moving back a week gets undone by old tests.
  const testLogs = (slotFilter, st) => logs
    .filter(l => l.isTest && l.programKey === prog.key && (!slotFilter || l.slot === slotFilter))
    .filter(l => !st || !st.manualSetAt || new Date(l.date) > new Date(st.manualSetAt))
    .sort((a,b)=> new Date(b.date) - new Date(a.date));

  const schedule = (st, testLog) => {
    const testedWeek = startOfWeekSunday(new Date(testLog.date));
    return {
      ...st,
      startDate: new Date(testedWeek.getTime() + MS_WEEK).toISOString(),
      testedWeek: testedWeek.toISOString(),
      lastTestLogId: testLog.id,
      prevStartDate: st.startDate,
      prevTestLogId: st.lastTestLogId || null,
      prevTestedWeek: st.testedWeek || null,
    };
  };

  if(prog.syncedTesting){
    const st = slots.__cycle;
    const latest = testLogs(null, st)[0];
    // Only a test from the current cycle can restart it - so logging the
    // Friday tests after Wednesday's doesn't shift the cycle a second time.
    if(st && latest && st.lastTestLogId !== latest.id
       && new Date(latest.date) >= startOfWeekSunday(new Date(st.startDate))){
      slots.__cycle = schedule(st, latest);
      changed = true;
    }
  } else {
    programLiftKeys(prog).forEach(slot=>{
      const st = slots[slot];
      if(!st) return;
      const latest = testLogs(slot, st)[0];
      if(!latest || st.lastTestLogId === latest.id) return;
      if(new Date(latest.date) < startOfWeekSunday(new Date(st.startDate))) return;
      const next = schedule(st, latest);
      next.startDate = avoidTestCollision(slot, new Date(next.startDate), slots, prog).toISOString();
      slots[slot] = next;
      changed = true;
    });
  }

  return { slotState: { ...allSlotState, [prog.key]: slots }, changed };
}

// Push a start date forward a week at a time until its test week is free.
// Staggered programs only; capped so a crowded schedule can't loop forever.
function avoidTestCollision(slot, proposedStart, progSlots, prog){
  const total = blockWeekCount();
  let start = new Date(proposedStart);
  for(let attempt=0; attempt<MAX_BLOCK_WEEKS; attempt++){
    const mine = projectedTestWeek(start.toISOString(), total).getTime();
    const clash = programLiftKeys(prog).some(other=>{
      if(other === slot) return false;
      const os = progSlots[other];
      if(!os) return false;
      return projectedTestWeek(os.startDate, total).getTime() === mine;
    });
    if(!clash) return start;
    start = new Date(start.getTime() + MS_WEEK);
  }
  return start;
}

// ---------- Seeding ----------

function seedProgramSlots(programKey){
  const prog = PROGRAMS[programKey];
  if(!prog) return false;
  const existing = { ...(STATE.slotState[programKey] || {}) };
  const total = blockWeekCount();
  const thisWeek = startOfWeekSunday(new Date());
  let changed = false;

  if(prog.syncedTesting){
    if(!existing.__cycle){
      existing.__cycle = { startDate: thisWeek.toISOString(), lastTestLogId: null };
      changed = true;
    }
  } else {
    // Fresh lifts start one week apart (the first at week 1), so their test
    // weeks are staggered from the outset; collision avoidance tidies up any
    // overlap when a short block leaves more lifts than weeks.
    const order = programLiftKeys(prog).sort((a,b)=> firstDayOf(prog,a) - firstDayOf(prog,b));
    order.forEach((slot, i)=>{
      const want = prog.lifts[slot].block;
      const st = existing[slot];
      if(st && st.blockKey === want) return;
      let start = new Date(thisWeek.getTime() - Math.min(i, total - 2) * MS_WEEK);
      start = avoidTestCollision(slot, start, existing, prog);
      existing[slot] = { blockKey: want, startDate: start.toISOString(), lastTestLogId: null };
      changed = true;
    });
  }

  // Drop entries the program no longer uses.
  Object.keys(existing).forEach(k=>{
    if(k === "__cycle"){ if(!prog.syncedTesting){ delete existing[k]; changed = true; } return; }
    if(!prog.lifts[k]){ delete existing[k]; changed = true; }
  });

  if(changed){
    STATE.slotState = { ...STATE.slotState, [programKey]: existing };
    saveKey("slotState", STATE.slotState);
  }
  return changed;
}

// ---------- Legacy migration ----------
// The live app stored block state per DAY at the top level of slotState and
// used ids like "Monday-primary-..." and "mon-2". Without this, upgrading
// would find no state under the new layout and reset every block in progress.

const LEGACY_DAY_SLOT = { Monday:"frontSquat", Tuesday:"bench", Wednesday:"hipThrust", Thursday:"ohp", Friday:"deadlift" };
const LEGACY_ACC = {
  "mon-2":["Monday","Straight Leg Deadlift (RDL)"], "mon-3":["Monday","Standing Calf Raise"],
  "tue-2":["Tuesday","Weighted Pull-up"],
  "wed-1":["Wednesday","Single Leg RDL"], "wed-2":["Wednesday","Bulgarian Split Squat"],
  "thu-2":["Thursday","DB Row"], "thu-3":["Thursday","Lateral Raise"],
  "fri-2":["Friday","Heavy Farmers Carry"], "fri-3":["Friday","Hanging Knee Raise"],
};

function migrateLegacy(slotState, logs){
  const ss = { ...(slotState || {}) };
  let slotsChanged = false, logsChanged = false;

  const legacyDays = Object.keys(ss).filter(k => DAY_ORDER.includes(k));
  if(legacyDays.length){
    const cf = { ...(ss.crossfit || {}) };
    legacyDays.forEach(day=>{
      const slot = LEGACY_DAY_SLOT[day];
      const old = ss[day];
      if(slot && old && old.startDate && !cf[slot]){
        cf[slot] = { blockKey: PROGRAMS.crossfit.lifts[slot].block,
                     startDate: old.startDate, lastTestLogId: old.lastTestLogId || null };
      }
      delete ss[day];
    });
    ss.crossfit = cf;
    slotsChanged = true;
  }

  const out = (logs || []).map(l=>{
    let n = l;
    const m = /^(Monday|Tuesday|Wednesday|Thursday|Friday)-primary-/.exec(l.exerciseId || "");
    if(m && LEGACY_DAY_SLOT[m[1]]){
      const slot = LEGACY_DAY_SLOT[m[1]];
      const id = exId("crossfit", m[1], slot) + (l.isTest ? ":test" : "");
      n = { ...n, exerciseId: id, programKey:"crossfit", slot };
    } else if(LEGACY_ACC[l.exerciseId]){
      const [d, name] = LEGACY_ACC[l.exerciseId];
      n = { ...n, exerciseId: accId("crossfit", d, name), programKey:"crossfit" };
    } else if(l.exerciseId === "sat-1"){
      n = { ...n, exerciseId: exId("crossfit","Saturday","cond"), programKey:"crossfit" };
    }
    if(!n.movement) n = { ...n, movement: slugify(n.exerciseName || n.title || "") };
    if(n !== l) logsChanged = true;
    return n;
  });

  return { slotState: ss, logs: out, slotsChanged, logsChanged };
}

function recommendedWeight(ex, oneRMs, logs){
  const lift = ex.lift;
  const increment = LIFT_INCREMENT[lift] || 2.5;

  // Added-load lifts progress from the last session: add a step when every
  // rep was hit (or the rep target dropped), otherwise repeat the load.
  if(ex.loadMode === "progression"){
    if(ex.isTest){
      const m = oneRMs[lift] || 0;
      return m ? round25(m + increment) : null;
    }
    const prior = logs.filter(l => l.lift === lift && l.type === "strength" && !l.isTest)
      .sort((a,b)=> new Date(b.date) - new Date(a.date))[0];
    if(!prior || !prior.weight) return null;
    const step = (prior.hitTarget && prior.reps === ex.reps) || prior.reps > ex.reps ? increment : 0;
    const w = round25(prior.weight + step);
    return ex.role === "light" ? round25(w * 0.8) : w;
  }

  if(ex.isTest && ex.testType !== "repMax") return round25((oneRMs[lift]||0)+increment);
  const base = round25((oneRMs[lift]||0)*ex.pct);
  const prior = logs.filter(l=>l.exerciseId===ex.id).sort((a,b)=>new Date(b.date)-new Date(a.date));
  const last = prior[0];
  if(!last || !last.weight) return base;
  // The block's reps-in-reserve curve sets the load. Last time at this same
  // prescription only adjusts it: missed reps hold the load at what you
  // managed, and a successful session never makes the target go backwards.
  if(last.reps === ex.reps && last.sets === ex.sets){
    return last.hitTarget ? Math.max(base, round25(last.weight)) : Math.min(base, round25(last.weight));
  }
  return base;
}

async function parseWodWithClaude(rawText){
  const response = await fetch("/api/parse-wod", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ rawText }),
  });
  if(!response.ok){
    let msg = "Request failed";
    try{ const e = await response.json(); if(e && e.error) msg = e.error; }catch{}
    throw new Error(msg);
  }
  return await response.json();
}

async function copyToClipboard(text){
  try{ if(navigator.clipboard && navigator.clipboard.writeText){ await navigator.clipboard.writeText(text); return true; } }catch{}
  try{
    const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.focus(); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    return true;
  }catch{ return false; }
}

// ---------- Formatting ----------

function setsSummary(sd){
  if(!sd || !sd.length) return "";
  const allSame = sd.every(s => s.reps===sd[0].reps && s.weight===sd[0].weight);
  if(allSame){
    return sd[0].weight ? `${sd.length} x ${sd[0].reps} @ ${sd[0].weight}kg` : `${sd.length} x ${sd[0].reps}`;
  }
  return sd.map(s => s.weight ? `${s.reps}@${s.weight}kg` : `${s.reps}`).join(", ");
}

function logLine(l){
  if(l.type==="strength" || l.type==="accessory"){
    if(l.setDetails && l.setDetails.length) return setsSummary(l.setDetails);
    return `${l.sets} x ${l.reps}${l.weight?` @ ${l.weight}kg`:""}`;
  }
  if(l.type==="conditioning"||l.type==="skill") return l.result || "No result logged";
  if(l.type==="customWod"){
    const moves = (l.movements||[]).map(m=>{
      const load = m.load ? ` @ ${m.load}kg` : "";
      return `${m.scheme?m.scheme+" ":""}${m.name}${load}`;
    }).join(", ");
    const body = moves || (l.rawText ? l.rawText.trim().split("\n").join(", ") : "");
    return `${l.format?l.format+" - ":""}${body}${body?" - ":""}${l.result||"No result logged"}`;
  }
  return l.result || "";
}
function logName(l){ return l.type==="customWod" ? l.title : l.exerciseName; }

// ---------- WHOOP export (per selected day, this training week) ----------

function whoopWodBlock(w){
  const lines = [];
  const head = w.format ? `${w.title} (${w.format}${w.timeCap?`, cap ${w.timeCap}`:""})` : w.title;
  lines.push(head);
  const moves = w.movements || [];
  if(moves.length){
    moves.forEach(m=>{
      const load = m.load ? ` @ ${m.load}kg` : "";
      lines.push(`  ${m.scheme ? m.scheme + " " : ""}${m.name}${load}`);
    });
  } else if(w.rawText && w.rawText.trim()){
    w.rawText.trim().split("\n").forEach(t=>{ if(t.trim()) lines.push(`  ${t.trim()}`); });
  }
  lines.push(`  Result: ${w.result || "completed"}`);
  return lines.join("\n");
}

function buildDayWhoopText(day, logs, journal, dayWod){
  const dayLogs = logs.filter(l => l.day===day && isThisTrainingWeek(l.date));
  const wod = dayWod && dayWod.result !== undefined ? dayWod : null;
  if(dayLogs.length===0 && !wod) return null;

  const lines = dayLogs.slice().reverse()
    .filter(l => l.type !== "customWod")
    .map(l => `${logName(l)} - ${logLine(l)}`);

  if(wod) lines.push(whoopWodBlock(wod));

  const jToday = journal.filter(j => j.day===day && isThisTrainingWeek(j.date));
  let text = `${day} Workout\n\n${lines.join("\n")}`;
  if(jToday.length) text += `\n\nNotes:\n${jToday.map(j=>j.text).join("\n")}`;
  return text.replace(/[\u2018\u2019]/g,"'").replace(/[\u201C\u201D]/g,'"')
             .replace(/[\u2013\u2014]/g,"-").replace(/\u00b7/g,"-").replace(/[^\x00-\x7F\n]/g,"");
}

const STATE = {
  tab: "today",
  selectedDay: todayName(),
  oneRMs: DEFAULT_ONE_RMS,
  logs: [],
  journal: [],
  prs: [],
  programKey: DEFAULT_PROGRAM_KEY,
  blockWeeks: DEFAULT_BLOCK_WEEKS,
  slotState: {},        // { programKey: { day: {...} } } - namespaced per program
  dayWods: {},          // { Monday: {..wod..}, ... } - cleared each Sunday 23:00
  setTicks: {},         // { exerciseId: [bool,...] } - working state during a session
  loaded: false,
  open: { strength: true, wod: false },   // collapsible section state
  editingLift: null,
  logSearch: "",
  logSubTab: "history",
  wodParsing: false,
  wodDraft: null,
  wodEditing: false,
};

async function init(){
  const [rms,l,j,p,storedSlotState,dayWods,storedTicks,settings] = await Promise.all([
    loadKey("oneRMs", DEFAULT_ONE_RMS),
    loadKey("logs", []),
    loadKey("journal", []),
    loadKey("prs", []),
    loadKey("slotState", {}),
    loadKey("dayWods", {}),
    loadKey("setTicks", {}),
    loadKey("settings", {}),
  ]);
  STATE.oneRMs = { ...DEFAULT_ONE_RMS, ...rms };
  // Carry the live app's per-day block state and old exercise ids across to
  // the per-program layout, so nothing already in progress gets reset.
  const mig = migrateLegacy(storedSlotState, l);
  STATE.logs = mig.logs; STATE.journal = j; STATE.prs = p;
  const infl = correctInflatedSingles(STATE.oneRMs, STATE.prs);
  if(infl.changed){
    STATE.oneRMs = infl.oneRMs; STATE.prs = infl.prs;
    saveKey("oneRMs", STATE.oneRMs); saveKey("prs", STATE.prs);
  }
  if(mig.logsChanged) saveKey("logs", STATE.logs);
  if(mig.slotsChanged) saveKey("slotState", mig.slotState);

  STATE.programKey = (settings && PROGRAMS[settings.programKey]) ? settings.programKey : DEFAULT_PROGRAM_KEY;
  STATE.blockWeeks = (settings && settings.blockWeeks) ? settings.blockWeeks : DEFAULT_BLOCK_WEEKS;

  // Drop any WOD saved before the current training week began.
  const boundary = weekBoundary();
  const freshWods = {};
  Object.entries(dayWods||{}).forEach(([day,w])=>{
    if(w && w.savedAt && new Date(w.savedAt) >= boundary) freshWods[day] = w;
  });
  STATE.dayWods = freshWods;
  if(Object.keys(freshWods).length !== Object.keys(dayWods||{}).length) saveKey("dayWods", freshWods);

  // Set ticks are working state for the current week only.
  if(storedTicks && storedTicks.weekStart === boundary.toISOString()){
    STATE.setTicks = storedTicks.ticks || {};
  } else {
    STATE.setTicks = {};
    saveKey("setTicks", { weekStart: boundary.toISOString(), ticks: {} });
  }

  STATE.slotState = mig.slotState || {};
  seedProgramSlots(STATE.programKey);

  // Catch up on any test already completed - including one done late, which
  // is what would otherwise leave two lifts testing in the same week.
  const realigned = realignSlotsAfterTests(STATE.slotState, STATE.logs);
  if(realigned.changed) saveKey("slotState", realigned.slotState);
  STATE.slotState = realigned.slotState;
  STATE.loaded = true;
  render();
}

function persistLogs(next){ STATE.logs = next; saveKey("logs", next); }
function persistOneRMs(next){ STATE.oneRMs = next; saveKey("oneRMs", next); }
function persistJournal(next){ STATE.journal = next; saveKey("journal", next); }
function persistPrs(next){ STATE.prs = next; saveKey("prs", next); }
function persistDayWods(next){ STATE.dayWods = next; saveKey("dayWods", next); }

function persistSetTicks(next){
  STATE.setTicks = next;
  saveKey("setTicks", { weekStart: weekBoundary().toISOString(), ticks: next });
}
function setTicksFor(exId, count){
  const t = STATE.setTicks[exId] || [];
  return Array.from({length:count}, (_,i)=> !!t[i]);
}
function toggleSetTick(exId, index, count){
  const cur = setTicksFor(exId, count);
  cur[index] = !cur[index];
  persistSetTicks({ ...STATE.setTicks, [exId]: cur });
  return cur[index];
}
function clearSetTicks(exId){
  const next = { ...STATE.setTicks };
  delete next[exId];
  persistSetTicks(next);
}

// Log a strength lift from per-set detail rows.
function logStrength(ex, setDetails){
  const valid = setDetails.filter(s => s.reps > 0);
  if(!valid.length) return false;
  const topWeight = Math.max(...valid.map(s=>s.weight||0));
  const topSet = valid.find(s => (s.weight||0) === topWeight) || valid[0];
  const hitTarget = valid.length >= ex.sets && valid.every(s => s.reps >= ex.reps);
  const logId = uid();
  const entry = {
    id: logId, date:new Date().toISOString(), day:STATE.selectedDay, type:"strength",
    exerciseId:ex.id, exerciseName:ex.name, lift:ex.lift, movement: ex.movement || slugify(ex.name),
    programKey: ex.programKey || null, slot: ex.slot || null, role: ex.role || null,
    setDetails: valid, sets: valid.length, reps: ex.reps, weight: topWeight, hitTarget,
    isTest: ex.isTest||false,
  };
  persistLogs([entry, ...STATE.logs]);
  // Added-load lifts only take a new max from a genuine test single.
  if(!ex.prFromTestOnly || ex.isTest) applyPrIfBeaten(logId, ex.lift, topWeight, topSet.reps, entry.date);
  if(ex.isTest) refreshSlotAlignment();
  return true;
}

// Re-derive block start dates from completed tests and persist the result.
function refreshSlotAlignment(){
  const r = realignSlotsAfterTests(STATE.slotState, STATE.logs);
  if(r.changed){ STATE.slotState = r.slotState; saveKey("slotState", r.slotState); }
}

// Raise the 1RM if this set beats it, recording both which log produced the
// PR and what the max was beforehand, so the change can be undone exactly if
// that log is later edited or deleted.
function applyPrIfBeaten(logId, lift, weight, reps, dateISO, opts){
  if(!lift || !weight) return;
  // Nearest 0.5kg - whole-kilo rounding turned a 102.5kg single into 103.
  const est = Math.round(epley1RM(weight, reps) * 2) / 2;
  const prev = STATE.oneRMs[lift] || 0;
  if(est > prev){
    persistOneRMs({ ...STATE.oneRMs, [lift]: est });
    persistPrs([{ id:`${logId}-pr`, logId, date:dateISO, lift,
      estOneRM:est, prevOneRM: prev, weight, reps,
      estimated: !!(opts && opts.estimated), label: (opts && opts.label) || null }, ...STATE.prs]);
  }
}

// Accessory movements aren't in the curated lift list, so build their labels
// from whatever has actually been recorded.
function accessoryMaxKeys(){
  const curated = new Set(Object.keys(LIFT_LABELS));
  const keys = new Set();
  STATE.prs.forEach(p=>{ if(p.estimated && !curated.has(p.lift)) keys.add(p.lift); });
  Object.keys(STATE.oneRMs).forEach(k=>{
    if(!curated.has(k) && STATE.oneRMs[k] > 0) keys.add(k);
  });
  return Array.from(keys);
}
function accessoryLabel(key){
  const pr = STATE.prs.find(p=>p.lift===key && p.label);
  if(pr) return pr.label;
  const log = STATE.logs.find(l=>l.movement===key);
  if(log) return log.exerciseName;
  return key.replace(/-/g," ").replace(/\b\w/g, c=>c.toUpperCase());
}

// Strip any PR created by this log and restore the max that preceded it -
// but only if the current max is still the one that PR set, so a manually
// entered number is never silently overwritten.
function revertPrsForLog(logId){
  const doomed = STATE.prs.filter(p => p.logId === logId);
  if(!doomed.length) return;
  persistPrs(STATE.prs.filter(p => p.logId !== logId));
  const nextRMs = { ...STATE.oneRMs };
  doomed.forEach(d=>{
    if(Math.abs((nextRMs[d.lift]||0) - d.estOneRM) < 0.51){
      nextRMs[d.lift] = d.prevOneRM ?? nextRMs[d.lift];
    }
  });
  persistOneRMs(nextRMs);
}

// Overwrite an existing log in place, keeping its position in history.
function updateSetLog(logId, ex, setDetails){
  const valid = setDetails.filter(s => s.reps > 0);
  if(!valid.length) return false;
  revertPrsForLog(logId);
  const topWeight = Math.max(...valid.map(s=>s.weight||0));
  const topSet = valid.find(s => (s.weight||0) === topWeight) || valid[0];
  const isStrength = ex.type === "strength";
  const next = STATE.logs.map(l => l.id !== logId ? l : {
    ...l,
    setDetails: valid,
    sets: valid.length,
    weight: topWeight || (isStrength ? 0 : null),
    hitTarget: valid.length >= ex.sets && valid.every(s => s.reps >= ex.reps),
    result: isStrength ? l.result : setsSummary(valid),
    editedAt: new Date().toISOString(),
  });
  persistLogs(next);
  if(isStrength && (!ex.prFromTestOnly || ex.isTest)) applyPrIfBeaten(logId, ex.lift, topWeight, topSet.reps, new Date().toISOString());
  return true;
}

function updateTextLog(logId, result){
  if(!result.trim()) return false;
  persistLogs(STATE.logs.map(l => l.id !== logId ? l : { ...l, result: result.trim(), editedAt:new Date().toISOString() }));
  return true;
}

function deleteLog(logId){
  revertPrsForLog(logId);
  const entry = STATE.logs.find(l => l.id === logId);
  persistLogs(STATE.logs.filter(l => l.id !== logId));
  // If this test restarted a cycle, put the cycle back exactly where it was,
  // then let realignment pick up any other test still standing (e.g. deleting
  // Wednesday's max while Friday's remains).
  if(entry && entry.isTest){
    const all = { ...STATE.slotState };
    let touched = false;
    Object.keys(all).forEach(pk=>{
      const slots = { ...(all[pk] || {}) };
      Object.keys(slots).forEach(k=>{
        const st = slots[k];
        if(st && st.lastTestLogId === logId){
          slots[k] = { ...st,
            startDate: st.prevStartDate || st.startDate,
            lastTestLogId: st.prevTestLogId || null,
            testedWeek: st.prevTestedWeek || null,
            prevStartDate: null, prevTestLogId: null, prevTestedWeek: null };
          touched = true;
        }
      });
      all[pk] = slots;
    });
    if(touched){ STATE.slotState = all; saveKey("slotState", all); }
    refreshSlotAlignment();
  }
}

function logAccessory(ex, setDetails){
  const valid = setDetails.filter(s => s.reps > 0);
  if(!valid.length) return false;
  const topWeight = Math.max(...valid.map(s=>s.weight||0));
  const topSet = valid.find(s => (s.weight||0) === topWeight) || valid[0];
  const logId = uid();
  persistLogs([{
    id:logId, date:new Date().toISOString(), day:STATE.selectedDay,
    exerciseId:ex.id, exerciseName:ex.name, movement: ex.movement || slugify(ex.name),
    programKey: ex.programKey || null,
    type:"accessory",
    setDetails: valid, sets: valid.length, reps: ex.reps,
    weight: topWeight || null,
    result: setsSummary(valid),
  }, ...STATE.logs]);
  // Accessories carry an estimated max too. It is never used to prescribe
  // loads - high-rep estimates are too unreliable for that - but it lets
  // progress on assistance work be tracked alongside the main lifts.
  if(topWeight > 0 && !ex.noEstimate){
    const key = ex.movement || slugify(ex.name);
    applyPrIfBeaten(logId, key, topWeight, topSet.reps, new Date().toISOString(), { estimated:true, label: ex.name });
  }
  return true;
}

function logConditioning(ex, result){
  persistLogs([{ id:uid(), date:new Date().toISOString(), day:STATE.selectedDay,
    exerciseId:ex.id, exerciseName:ex.name, type:"conditioning", result }, ...STATE.logs]);
}
function logSkill(ex, result){
  persistLogs([{ id:uid(), date:new Date().toISOString(), day:STATE.selectedDay,
    exerciseId:ex.id, exerciseName:ex.name, type:"skill", result, isTest:ex.isTest||false }, ...STATE.logs]);
  if(ex.isTest) refreshSlotAlignment();
}
function update1RM(lift, value){
  const v = parseFloat(value);
  if(isNaN(v)) return;
  persistOneRMs({ ...STATE.oneRMs, [lift]: v });
}
function addJournal(text){
  if(!text.trim()) return;
  persistJournal([{ id:uid(), date:new Date().toISOString(), day:STATE.selectedDay, text }, ...STATE.journal]);
}

function renderMain(){
  const el = document.getElementById('main-content');
  if(STATE.tab==="today"){ el.innerHTML = renderToday(); attachTodayHandlers(); }
  else if(STATE.tab==="program"){ el.innerHTML = renderProgram(); attachProgramHandlers(); }
  else if(STATE.tab==="lifts"){ el.innerHTML = renderLifts(); attachLiftsHandlers(); }
  else if(STATE.tab==="log"){ el.innerHTML = renderLog(); attachLogHandlers(); }
}

// ---------- Today ----------

function renderToday(){
  const day = STATE.selectedDay;
  const prog = activeProgram();
  const cfg = dayConfig(day);
  const sessions = buildDaySessions(day);
  const cond = dayConditioning(day);
  const strengthEx = [ ...sessions, ...dayAccessories(day), ...(cond ? [cond] : []) ];
  const syncedPos = prog.syncedTesting ? cyclePosition(prog, null) : null;
  const isTestDay = sessions.some(s => s.role === "test");

  let subtitle;
  if(!sessions.length){
    subtitle = esc(cfg.focus || "Rest");
  } else if(sessions.length === 1 && !prog.syncedTesting){
    const p = sessions[0];
    subtitle = `${esc(p.name)} - Week ${p.weekInBlock}/${p.totalWeeks} - ${esc(p.blockLabel)}`;
  } else {
    const p = sessions[0];
    const kind = isTestDay ? "Test day" : (syncedPos && syncedPos.testWeek) ? "Light week" : cfg.kind === "light" ? "Light day" : "Strength day";
    subtitle = `${kind} - Week ${p.weekInBlock}/${p.totalWeeks}`;
  }

  let html = `<div class="pill-row">${DAY_ORDER.map(d=>
    `<button class="pill ${d===day?'active':''}" data-day="${d}">${d.slice(0,3)}</button>`
  ).join('')}</div>`;

  html += `<div style="margin-bottom:16px">
    <div class="disp" style="font-size:24px;text-transform:uppercase;font-weight:600">${day}</div>
    <div class="small accent">${subtitle}${sessions.length ? ` <button class="linkbtn" id="change-week-link" style="padding:0 0 0 4px;font-size:11px">change week</button>` : ''}</div></div>`;

  // Synced test week: say plainly what's happening and when the maxes are.
  if(syncedPos && syncedPos.testWeek){
    const plan = Object.entries(prog.testDays||{}).map(([d, lifts])=>
      `${d}: ${lifts.map(k=>{ const b = liftBlock(prog,k); return b ? b.name + (b.testType==="repMax" ? ` ${b.testReps}RM` : "") : k; }).join(", ")}`
    ).join(" &middot; ");
    html += `<div class="card test" style="display:flex;gap:8px;align-items:flex-start">
      ${iconSpan('trend',15,GOOD)}
      <div class="small"><span class="good" style="font-weight:600">${syncedPos.complete ? "Test week overdue." : "Test week."}</span>
      Everything else is light. ${plan}.
      The next cycle starts the week after you test.</div></div>`;
  } else {
    const overdue = sessions.find(s => s.complete);
    if(overdue){
      html += `<div class="card warn" style="display:flex;gap:8px;align-items:flex-start">
        ${iconSpan('refresh',15,ACCENT)}
        <div class="small"><span class="accent" style="font-weight:600">Test week overdue.</span>
        Log the ${overdue.testType==="repMax" ? `${overdue.testReps||5}RM` : "1RM"} whenever you get to it -
        ${esc(overdue.name)} then restarts at week 1 off your new max.</div></div>`;
    }
  }

  if(cfg.kind === "light" && !isTestDay && !(syncedPos && syncedPos.testWeek)){
    html += `<div class="xsmall muted" style="margin:-6px 0 12px">Short session - room for a CrossFit workout after. Log it in the WOD section below.</div>`;
  }

  // ----- Strength section -----
  const loggedIds = new Set(STATE.logs.filter(l=>isThisTrainingWeek(l.date)).map(l=>l.exerciseId));
  const doneCount = strengthEx.filter(e=>loggedIds.has(e.id)).length;
  html += section("strength", "Strength & Accessories",
    strengthEx.length ? `${doneCount}/${strengthEx.length} logged this week` : "Rest day",
    strengthEx.length === 0
      ? `<div class="card small muted" style="text-align:center">Rest day. Recover, hydrate, sleep.</div>`
      : strengthEx.map(ex =>
          ex.type==="strength" ? strengthCard(ex)
          : ex.type==="skill" ? skillCard(ex)
          : ex.type==="conditioning" ? conditioningCard(ex)
          : accessoryCard(ex)
        ).join('')
  );

  // ----- WOD section -----
  const saved = STATE.dayWods[day];
  const wodSub = saved ? esc(saved.title) : "None added";
  html += section("wod", "WOD", wodSub,
    (saved && !STATE.wodEditing) ? savedWodCard(day, saved) : wodEditor(day, saved));

  // ----- Copy button (always present) -----
  const copyText = buildDayWhoopText(day, STATE.logs, STATE.journal, STATE.dayWods[day]);
  html += `<div style="margin-top:24px;display:flex;flex-direction:column;align-items:center;gap:6px">
    <button class="btn-copy-sm" id="copy-whoop-btn" ${copyText?'':'disabled'}>
      ${ICONS.copy}<span id="copy-whoop-label">Copy ${day} Workout</span></button>
    ${copyText ? '' : `<div class="xsmall muted">Log something to enable</div>`}
  </div>`;

  return html;
}

function section(key, title, subtitle, bodyHtml){
  const open = STATE.open[key];
  return `<div class="section">
    <div class="section-head" data-section="${key}">
      <div class="titles"><div class="t">${title}</div><div class="s">${subtitle}</div></div>
      <span class="chev ${open?'open':''}">${ICONS.chevron}</span>
    </div>
    ${open ? `<div class="section-body">${bodyHtml}</div>` : ''}
  </div>`;
}

function blockBadge(ex){
  if(!ex.blockLabel) return '';
  const color = ex.isTest ? GOOD : '#8B8F96';
  return `<div class="xsmall" style="text-transform:uppercase;letter-spacing:0.03em;color:${color};margin-top:4px">
    Week ${ex.weekInBlock}/${ex.totalWeeks || blockWeekCount()} - ${esc(ex.blockLabel)}${ex.isTest?' - Test Day':''}</div>`;
}

// Numeric input tuned for phones: decimal keypad, no spinner, no leading zero.
function numInput(cls, value, placeholder, extra){
  return `<input inputmode="decimal" class="tab-num numfield ${cls}" value="${value===null||value===undefined?'':value}"
    placeholder="${placeholder||''}" ${extra||''}/>`;
}

// Small progress line so a part-finished lift is obvious at a glance. Always
// rendered (blank at zero) so the tick handler has an element to update.
function tickProgress(exId, count){
  const done = setTicksFor(exId, count).filter(Boolean).length;
  const all = done === count && count > 0;
  return `<div class="xsmall tick-progress" style="margin-top:10px;color:${all?GOOD:'#8B8F96'}">${done?`${done}/${count} sets ticked${all?' - ready to log':''}`:''}</div>`;
}

function setRows(ex, prefill, showWeight){
  const ticks = setTicksFor(ex.id, ex.sets);
  let rows = `<div class="setrow head"><div></div><div></div>
    <div class="lbl">Reps</div>${showWeight?`<div class="lbl">Weight kg</div>`:`<div class="lbl">&nbsp;</div>`}</div>`;
  for(let i=0;i<ex.sets;i++){
    const p = prefill[i] || {};
    rows += `<div class="setrow ${ticks[i]?'ticked':''}" data-set="${i}">
      <input type="checkbox" class="settick" data-tickidx="${i}" ${ticks[i]?'checked':''} aria-label="Set ${i+1} done"/>
      <div class="setno">${i+1}</div>
      ${numInput('f-reps', p.reps ?? ex.reps, '')}
      ${showWeight ? numInput('f-weight', p.weight ?? '', '-') : `<div class="xsmall muted" style="text-align:center">bodyweight</div>`}
    </div>`;
  }
  return rows;
}

// "Last time" matches on the MOVEMENT, so switching program keeps showing what
// you last did on that lift. "Logged this week" and edit/delete stay keyed to
// the exercise id, so they only ever act on this program's own entry.
// "Last time" prefers this exact session (so a light day compares with the
// last light day, not Monday's heavy sets), then falls back to the same
// MOVEMENT anywhere - which is what carries history across programs.
function lastEntryFor(ex){
  const id = typeof ex === "string" ? ex : ex.id;
  const mv = typeof ex === "string" ? null : ex.movement;
  const byDate = (a,b)=> new Date(b.date) - new Date(a.date);
  const same = STATE.logs.filter(l => l.exerciseId === id).sort(byDate)[0];
  if(same || !mv) return same;
  return STATE.logs.filter(l => l.movement === mv && !l.isTest).sort(byDate)[0];
}
function loggedThisWeek(exId){
  return STATE.logs.find(l=>l.exerciseId===exId && isThisTrainingWeek(l.date));
}

function roleChip(role){
  if(!role) return '';
  const bg = role === "heavy" ? ACCENT : role === "test" ? GOOD : "#26292E";
  const fg = role === "heavy" || role === "test" ? "#121316" : "#9CA0A7";
  return `<span class="chip" style="background:${bg};color:${fg};margin-left:6px;vertical-align:2px">${ROLE_LABEL[role]||role}</span>`;
}

// Prescription line. Percentages are always of the (estimated) 1RM - that
// includes hip thrust, whose test is a 5RM but whose loads are 1RM-based.
function prescriptionLine(ex, rec){
  if(ex.isTest){
    const what = ex.loadMode === "progression" ? "Max added weight, 1 rep"
               : ex.testType === "repMax" ? `${ex.testReps||5}RM test` : "1RM test";
    const at = rec ? ` - open around ${rec}kg` : ex.loadMode === "progression" ? "" : " - set your max in Lifts first";
    return what + at;
  }
  if(ex.loadMode === "progression"){
    return `${ex.sets} x ${ex.reps}` + (rec != null ? ` - suggested +${rec}kg` : " - pick a load you can hit cleanly");
  }
  return `${ex.sets} x ${ex.reps} @ ${Math.round(ex.pct*100)}% of 1RM` + (rec ? ` - target ${rec}kg` : " - set your 1RM in Lifts");
}

// Reps-in-reserve target. Near the limit, the load assumes your max is
// accurate - so give a plain cue for backing off if the first set says it isn't.
function rirLine(ex){
  if(ex.rir === null || ex.rir === undefined || ex.isTest) return '';
  const r = ex.rir;
  const words = r <= 0.5 ? "0-1 reps left in the tank"
              : r === 1 ? "about 1 rep left in the tank"
              : r >= 5 ? "5+ reps left in the tank - should feel easy"
              : `about ${r} reps left in the tank`;
  const near = ex.role === "heavy" && r <= 1.5;
  const color = near ? ACCENT : '#9CA0A7';
  return `<div class="xsmall" style="margin-top:4px;color:${color}">Target: ${words}${near ? ` on the first set. If it moves slowly, drop 2.5-5kg for the rest.` : ''}</div>`;
}

function strengthCard(ex){
  const rec = recommendedWeight(ex, STATE.oneRMs, STATE.logs);
  const already = loggedThisWeek(ex.id);
  const last = already ? null : lastEntryFor(ex);
  // When already logged, the rows show what was actually recorded so it can
  // be corrected in place; otherwise they show the prescription.
  const prefill = already && already.setDetails && already.setDetails.length
    ? already.setDetails
    : Array.from({length:ex.sets}, () => ({ reps: ex.reps, weight: rec ? rec : '' }));
  const rowCount = already ? prefill.length : ex.sets;
  return `<div class="card ${ex.isTest?'test':''}" data-card="${ex.id}" data-extype="strength"
      data-exjson='${escAttr(ex)}' ${already?`data-logid="${already.id}"`:''}>
    <div style="display:flex;justify-content:space-between;align-items:flex-start">
      <div>
        <div class="disp" style="font-size:16px;font-weight:600">${esc(ex.name)}${roleChip(ex.role)}</div>
        <div class="xsmall muted" style="margin-top:2px">${esc(prescriptionLine(ex, rec))}</div>
        ${ex.style ? `<div class="xsmall" style="margin-top:4px;color:#d6d3d1">${esc(ex.style)}</div>` : ''}
        ${rirLine(ex)}
        ${blockBadge(ex)}
      </div>
      <span style="display:${already?'inline-flex':'none'}">${iconSpan('check',18,GOOD)}</span>
    </div>
    ${last ? `<div class="card sub" style="margin-top:10px"><div class="lbl">Last time</div>
      <div class="small" style="color:#d6d3d1;margin-top:2px">${esc(logLine(last))}</div></div>`:''}
    ${already ? `<div class="xsmall good" style="margin-top:10px">Logged ${fmtDate(already.date)}${already.editedAt?' (edited)':''} - adjust below to correct it</div>`:tickProgress(ex.id, rowCount)}
    <div style="margin-top:12px">${setRows({...ex, sets:rowCount}, prefill, true)}</div>
    ${already
      ? `<div class="flex-gap">
           <button class="btn btn-primary update-sets-btn" style="flex:1">Update</button>
           <button class="btn btn-ghost delete-log-btn" style="flex:0 0 46px;padding:10px 0">${iconSpan('trash',14,'#8B8F96')}</button>
         </div>`
      : `<button class="btn btn-primary log-sets-btn">${ex.isTest ? 'Log Test' : 'Log Sets'}</button>`}
  </div>`;
}

function accessoryCard(ex){
  const already = loggedThisWeek(ex.id);
  const last = already ? null : lastEntryFor(ex);
  // Programmed accessories declare bodyweight explicitly. Guessing from the
  // name is only for pasted WODs - it mislabelled "Chest-supported Row".
  const showWeight = !ex.bodyweight;
  const lastSets = last && last.setDetails ? last.setDetails : [];
  const prefill = already && already.setDetails && already.setDetails.length
    ? already.setDetails
    : Array.from({length:ex.sets}, (_,i) => ({
        reps: lastSets[i]?.reps ?? ex.reps,
        weight: lastSets[i]?.weight ?? (lastSets[0]?.weight ?? ''),
      }));
  const rowCount = already ? prefill.length : ex.sets;
  const unit = ex.repUnit || "";
  return `<div class="card" data-card="${ex.id}" data-extype="accessory"
      data-exjson='${escAttr(ex)}' ${already?`data-logid="${already.id}"`:''}>
    <div style="display:flex;justify-content:space-between;align-items:flex-start">
      <div>
        <div class="disp" style="font-size:16px;font-weight:600">${esc(ex.name)}</div>
        <div class="xsmall muted" style="margin-top:2px">Suggested ${ex.sets} x ${ex.reps}${unit}</div>
        <div class="small muted" style="margin-top:2px">${esc(ex.detail)}</div>
      </div>
      <span style="display:${already?'inline-flex':'none'}">${iconSpan('check',18,GOOD)}</span>
    </div>
    ${last ? `<div class="card sub" style="margin-top:10px"><div class="lbl">Last time</div>
      <div class="small" style="color:#d6d3d1;margin-top:2px">${esc(logLine(last))}</div></div>`:''}
    ${already ? `<div class="xsmall good" style="margin-top:10px">Logged ${fmtDate(already.date)}${already.editedAt?' (edited)':''} - adjust below to correct it</div>`:tickProgress(ex.id, rowCount)}
    <div style="margin-top:12px">${setRows({...ex, sets:rowCount}, prefill, showWeight)}</div>
    ${already
      ? `<div class="flex-gap">
           <button class="btn btn-primary update-sets-btn" style="flex:1">Update</button>
           <button class="btn btn-ghost delete-log-btn" style="flex:0 0 46px;padding:10px 0">${iconSpan('trash',14,'#8B8F96')}</button>
         </div>`
      : `<button class="btn btn-primary log-sets-btn">Log Sets</button>`}
  </div>`;
}

function skillCard(ex){

// ---------- WOD: editor / saved card ----------

function wodEditor(day, existing){
  const draft = STATE.wodDraft;
  let html = `<div class="card">
    <p class="xsmall muted" style="margin:0 0 10px">Paste today's WOD and I'll break it into movements. It stays on ${day} until Sunday 11pm.</p>
    <textarea id="wod-raw" rows="5" placeholder="e.g.&#10;For Time:&#10;21-15-9&#10;Thrusters 42.5kg&#10;Pull-ups">${existing? esc(existing.rawText||'') : ''}</textarea>
    <button class="btn btn-primary" id="wod-parse-btn" style="margin-top:10px">${STATE.wodParsing?'Reading...':'Read &amp; Break Down'}</button>
    <div id="wod-error" class="xsmall accent" style="margin-top:8px"></div>`;

  if(draft){
    html += `<div style="margin-top:14px;border-top:1px solid #33363C;padding-top:12px">
      <div class="disp" style="font-size:16px;font-weight:600">${esc(draft.title)}</div>
      <div class="xsmall accent" style="margin-top:2px">${esc(draft.format||'')}${draft.timeCap?` - cap ${esc(draft.timeCap)}`:''}</div>
      <div style="margin-top:10px">`;
    (draft.movements||[]).forEach((m,i)=>{
      const wantsWeight = needsWeight(m.name);
      html += `<div class="setrow" data-move="${i}" style="grid-template-columns:1fr 90px">
        <div class="small" style="color:#d6d3d1">${esc(m.scheme||'')} ${esc(m.name)}
          ${wantsWeight?'':`<span class="chip" style="margin-left:4px">no load</span>`}</div>
        ${wantsWeight ? numInput('f-load', m.load ?? '', 'kg') : `<div></div>`}
      </div>`;
    });
    html += `</div>
      <div class="lbl" style="margin-top:8px">Your result</div>
      <input type="text" id="wod-result" placeholder="Time, rounds, or score" value="${esc(draft.result||'')}"/>
      <button class="btn btn-primary" id="wod-save-btn" style="margin-top:10px">Save to ${day}</button>
    </div>`;
  } else {
    html += `<button class="linkbtn" id="wod-skip-btn" style="margin-top:8px;width:100%">Save raw text without parsing</button>`;
  }
  if(existing) html += `<button class="linkbtn" id="wod-cancel-edit" style="width:100%;margin-top:4px">Cancel</button>`;
  html += `</div>`;
  return html;
}

// ---------- Program ----------

function renderProgram(){
  const prog = activeProgram();
  const total = blockWeekCount();
  const intro = prog.syncedTesting
    ? `Every lift runs one shared ${total}-week cycle. Each lift has heavy, medium and light days - only the heavy day is meant to be hard. The final week is a light week with all maxes tested together, then the cycle restarts off your new numbers. Weeks roll over Sunday 11pm.`
    : `Each training day runs one focus lift on its own ${total}-week block. After the final test the same lift restarts at week 1 off your new max, staggered so no two lifts test in the same week. Weeks roll over Sunday 11pm.`;
  let html = `<div class="disp" style="font-size:24px;text-transform:uppercase;font-weight:600;margin-bottom:4px">${esc(prog.name)}</div>
  <p class="xsmall muted" style="margin-bottom:12px;line-height:1.45">${intro}</p>`;

  html += renderWeekControl(prog);

  DAY_ORDER.forEach(day=>{
    const cfg = dayConfig(day);
    const sessions = buildDaySessions(day);
    const accs = dayAccessories(day);
    const cond = dayConditioning(day);
    const rest = !sessions.length && !accs.length && !cond;
    const tag = !sessions.length ? esc(cfg.focus || 'Rest')
              : sessions.some(x=>x.role==="test") ? 'Test day'
              : cfg.kind === "light" ? 'Light + CrossFit'
              : prog.syncedTesting ? 'Strength'
              : `Week ${sessions[0].weekInBlock}/${sessions[0].totalWeeks}`;
    html += `<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <div class="disp" style="font-size:15px;font-weight:600;text-transform:uppercase">${day}</div>
        <div class="xsmall accent">${tag}</div>
      </div>`;
    sessions.forEach(p=>{
      const detail = p.type === "skill" ? esc(p.prescription)
        : p.isTest ? (p.loadMode === "progression" ? "Max added weight" : p.testType === "repMax" ? `${p.testReps}RM test` : "1RM test")
        : p.loadMode === "progression" ? `${p.sets}x${p.reps}, load from last session`
        : `${p.sets}x${p.reps} @ ${Math.round(p.pct*100)}%`;
      html += `<div class="card sub" style="margin-top:8px;display:flex;justify-content:space-between;align-items:center;gap:8px">
        <div>
          <div class="small" style="font-weight:500">${esc(p.name)}${roleChip(p.role)}</div>
          ${prog.syncedTesting ? '' : `<div class="xsmall muted" style="margin-top:2px">${esc(p.blockLabel)}</div>`}
        </div>
        <div class="xsmall muted tab-num" style="text-align:right">${detail}</div>
      </div>`;
    });
    if(accs.length || cond){
      html += `<div style="margin-top:8px">`;
      accs.forEach(ex=>{
        html += `<div class="small" style="display:flex;justify-content:space-between;color:#d6d3d1;padding:2px 0">
          <span>${esc(ex.name)}</span><span class="muted tab-num">${ex.sets}x${ex.reps}${ex.repUnit||''}</span></div>`;
      });
      if(cond){
        html += `<div class="small" style="display:flex;justify-content:space-between;color:#d6d3d1;padding:2px 0">
          <span>${esc(cond.name)}</span><span class="muted tab-num">For time</span></div>`;
      }
      html += `</div>`;
    }
    if(rest) html += `<div class="small muted" style="font-style:italic;margin-top:6px">Rest</div>`;
    html += `</div>`;
  });

  html += renderProgramPicker();
  return html;
}

// ---------- Program picker ----------

function renderProgramPicker(){
  const prog = activeProgram();
  const total = blockWeekCount();
  let html = `<div style="margin-top:28px;border-top:1px solid #26292E;padding-top:20px">
    <div class="disp" style="font-size:17px;text-transform:uppercase;font-weight:600;margin-bottom:4px">Choose a Program</div>
    <p class="xsmall muted" style="margin-bottom:12px">Switching keeps every 1RM and all logged history - only the weekly layout changes. Each program remembers where its blocks were up to.</p>`;

  Object.values(PROGRAMS).forEach(p=>{
    const active = p.key === prog.key;
    const trainDays = DAY_ORDER.filter(d=>{
      const c = p.days[d];
      return c && ((c.sessions||[]).length || (c.accessories||[]).length || c.conditioning);
    }).length;
    html += `<div class="card" data-progpick="${p.key}" style="cursor:pointer;${active?`border:1px solid ${ACCENT}`:''}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
        <div style="flex:1">
          <div class="disp" style="font-size:15px;font-weight:600">${esc(p.name)}</div>
          <div class="xsmall muted" style="margin-top:3px">${esc(p.blurb)}</div>
          <div class="xsmall muted" style="margin-top:5px">${trainDays} training days/week</div>
        </div>
        ${active ? `<span class="chip" style="background:${ACCENT};color:#121316">Active</span>` : ''}
      </div>
    </div>`;
  });

  html += `<div style="margin-top:18px">
    <div class="disp" style="font-size:15px;text-transform:uppercase;font-weight:600;margin-bottom:4px">Retest Every</div>
    <p class="xsmall muted" style="margin-bottom:10px">How long each block runs before its test week. The prescriptions rescale to fit - shorter blocks ramp faster, longer ones spend more time accumulating volume.</p>
    <div class="pill-row" style="margin-bottom:6px">`;
  for(let n=MIN_BLOCK_WEEKS; n<=MAX_BLOCK_WEEKS; n++){
    html += `<button class="pill ${n===total?'active':''}" data-weeks="${n}">${n} wk</button>`;
  }
  html += `</div></div>`;

  return html + `</div>`;
}

function renderLifts(){
  let html = `<div style="margin-bottom:16px">
    <div class="disp" style="font-size:24px;text-transform:uppercase;font-weight:600">Current 1RMs</div>
    <p class="xsmall muted" style="margin-top:4px">Tap the pencil to set or correct a max. Beating one on Today updates it automatically.</p></div>`;
  LIFT_GROUPS.forEach(group=>{
    html += `<div style="margin-bottom:20px"><div class="xsmall muted" style="text-transform:uppercase;margin-bottom:8px">${group.title}</div><div class="grid2">`;
    group.lifts.forEach(k=>{
      const editing = STATE.editingLift === k;
      const v = STATE.oneRMs[k] || 0;
      html += `<div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div class="xsmall muted" style="text-transform:uppercase">${LIFT_LABELS[k]}</div>
          <button class="edit-lift-btn" data-lift="${k}" style="background:none;border:none;cursor:pointer;padding:0">${iconSpan('pencil',13,'#8B8F96')}</button>
        </div>
        ${editing
          ? `<input inputmode="decimal" class="lift-edit-input tab-num numfield" data-lift="${k}" value="${v}" style="margin-top:4px;font-size:18px;font-weight:600;color:${ACCENT}"/>`
          : `<div class="disp tab-num accent" style="font-size:24px;font-weight:600;margin-top:2px">${v} <span class="small muted">kg</span></div>`}
      </div>`;
    });
    html += `</div></div>`;
  });
  const accKeys = accessoryMaxKeys();
  if(accKeys.length){
    html += `<div style="margin-bottom:20px">
      <div class="xsmall muted" style="text-transform:uppercase;margin-bottom:4px">Accessory Estimates</div>
      <p class="xsmall muted" style="margin-bottom:8px;line-height:1.4">Calculated from your logged sets, not tested directly. Estimates from high-rep work are rough - treat them as a progress signal, not a true max. These never drive prescribed loads.</p>
      <div class="grid2">`;
    accKeys.forEach(k=>{
      const editing = STATE.editingLift === k;
      const v = STATE.oneRMs[k] || 0;
      html += `<div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:4px">
          <div class="xsmall muted" style="text-transform:uppercase;line-height:1.2">${esc(accessoryLabel(k))}</div>
          <button class="edit-lift-btn" data-lift="${k}" style="background:none;border:none;cursor:pointer;padding:0">${iconSpan('pencil',13,'#8B8F96')}</button>
        </div>
        ${editing
          ? `<input inputmode="decimal" class="lift-edit-input tab-num numfield" data-lift="${k}" value="${v}" style="margin-top:4px;font-size:18px;font-weight:600;color:${ACCENT}"/>`
          : `<div class="disp tab-num" style="font-size:22px;font-weight:600;margin-top:2px;color:#C7CAD1">${v} <span class="small muted">kg</span></div>`}
      </div>`;
    });
    html += `</div></div>`;
  }

  html += `<div><div class="disp" style="font-size:17px;font-weight:600;text-transform:uppercase;display:flex;align-items:center;gap:6px;margin-bottom:8px">
    ${iconSpan('trend',16,GOOD)} PR History</div>`;
  if(!STATE.prs.length){
    html += `<div class="card small muted">No PRs yet - beat a rep target on Today to set one.</div>`;
  } else {
    STATE.prs.slice(0,15).forEach(pr=>{
      html += `<div class="card" style="display:flex;justify-content:space-between;align-items:center;padding:12px">
        <div><div class="small" style="font-weight:500">${esc(LIFT_LABELS[pr.lift] || accessoryLabel(pr.lift))}${pr.estimated?` <span class="xsmall muted">est</span>`:''}</div><div class="xsmall muted">${fmtDate(pr.date)}</div></div>
        <div style="text-align:right"><div class="disp tab-num good" style="font-weight:600">est. ${pr.estOneRM} kg</div>
        <div class="xsmall muted tab-num">${pr.weight}kg x ${pr.reps}</div></div></div>`;
    });
  }
  return html + `</div>`;
}

    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">

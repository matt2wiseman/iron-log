<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #121316; color: #F2F0EA;
    font-family: 'Inter', sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .disp { font-family: 'Oswald', sans-serif; letter-spacing: 0.02em; }
  .tab-num { font-variant-numeric: tabular-nums; }
  ::-webkit-scrollbar { display: none; }

  #app { min-height: 100vh; display: flex; flex-direction: column; }
  .wrap { max-width: 480px; width: 100%; margin: 0 auto; padding: 0 16px; }

  header.hdr { padding: 24px 16px 12px; }
  header.hdr .row { display: flex; align-items: baseline; gap: 8px; }
  header.hdr h1 { font-size: 20px; font-weight: 600; text-transform: uppercase; margin: 0; }

  main { flex: 1; overflow-y: auto; padding: 16px 16px 96px; }

  nav.tabbar { position: fixed; bottom: 0; left: 0; right: 0; background: #17181B; border-top: 1px solid #26292E; }
  nav.tabbar .row { max-width: 480px; margin: 0 auto; display: flex; }

  nav.tabbar button.active { color: #E4572E; }
  nav.tabbar button span { font-size: 9px; text-transform: uppercase; letter-spacing: 0.03em; font-weight: 500; text-align: center; line-height: 1.1; }
  nav.tabbar svg { width: 19px; height: 19px; }

  .card { background: #1C1E22; border-radius: 16px; padding: 16px; margin-bottom: 12px; }
  .card.sub { background: #26292E; border-radius: 12px; padding: 10px 12px; }
  .card.test { border: 1px solid #7FB069; }
  .card.warn { border: 1px solid #E4572E; }

  /* Collapsible section */
  .section { background: #1C1E22; border-radius: 16px; margin-bottom: 12px; overflow: hidden; }
  .section-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; cursor: pointer; user-select: none;
  }
  .section-head .titles { display: flex; flex-direction: column; gap: 2px; }
  .section-head .t { font-family: 'Oswald', sans-serif; font-size: 15px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.02em; }
  .section-head .s { font-size: 11px; color: #8B8F96; }
  .section-head .chev { color: #8B8F96; width: 18px; height: 18px; transition: transform 0.2s; flex-shrink: 0; }
  .section-head .chev.open { transform: rotate(90deg); }
  .section-body { padding: 0 12px 12px; }
  .section-body > .card { background: #23262B; }

  .pill-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin: 0 -16px 12px; padding-left: 16px; padding-right: 16px; }
  .pill { flex-shrink: 0; padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.02em; background: #1C1E22; color: #8B8F96; border: none; cursor: pointer; }
  .pill.active { background: #E4572E; color: #121316; }

  .lbl { font-size: 10px; text-transform: uppercase; color: #8B8F96; letter-spacing: 0.03em; margin-bottom: 4px; }
  input[type="text"], input[type="number"], textarea, input[inputmode] {

  }
  input:focus { box-shadow: inset 0 0 0 1px #E4572E; }
  textarea { resize: none; border-radius: 16px; padding: 12px; }
  input::placeholder { color: #6b7280; }
  /* Hide spinner arrows - we want a clean numeric field */
  input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }

  .setrow { display: grid; grid-template-columns: 34px 1fr 1fr; gap: 8px; align-items: center; margin-bottom: 8px; }
  .setrow .setno { font-family: 'Oswald', sans-serif; font-size: 13px; color: #8B8F96; text-align: center; }
  .setrow.head .lbl { margin-bottom: 0; }

  .btn-done { background: #26292E; color: #8B8F96; }

    border-radius: 999px; padding: 8px 18px; font-size: 12px; font-weight: 500;

<body>

<script>
// ============================================================
// Constants
// ============================================================

const DAY_ORDER = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];

const LIFT_LABELS = {
  squat:"Back Squat", frontSquat:"Front Squat", overheadSquat:"Overhead Squat",
  deadlift:"Deadlift", sumoDeadlift:"Sumo Deadlift",
  bench:"Bench Press", ohp:"Strict Press", pushPress:"Push Press", pushJerk:"Push Jerk", splitJerk:"Split Jerk",
  snatch:"Snatch", powerSnatch:"Power Snatch", hangSnatch:"Hang Snatch",
  clean:"Clean", powerClean:"Power Clean", hangClean:"Hang Clean", cleanAndJerk:"Clean & Jerk",
  thruster:"Thruster", hipThrust:"Hip Thrust",
};

const LIFT_GROUPS = [
  { title:"Squat", lifts:["squat","frontSquat","overheadSquat"] },
  { title:"Deadlift", lifts:["deadlift","sumoDeadlift"] },
  { title:"Press", lifts:["bench","ohp","pushPress","pushJerk","splitJerk"] },
  { title:"Snatch", lifts:["snatch","powerSnatch","hangSnatch"] },
  { title:"Clean", lifts:["clean","powerClean","hangClean","cleanAndJerk"] },
  { title:"Other", lifts:["thruster","hipThrust"] },
];

const LIFT_INCREMENT = {
  squat:5, frontSquat:2.5, overheadSquat:2.5, deadlift:5, sumoDeadlift:5,
  bench:2.5, ohp:2.5, pushPress:2.5, pushJerk:2.5, splitJerk:2.5,
  snatch:1, powerSnatch:1, hangSnatch:1,
  clean:2.5, powerClean:2.5, hangClean:2.5, cleanAndJerk:2.5,
  thruster:2.5, hipThrust:5,
};

const DEFAULT_ONE_RMS = Object.keys(LIFT_LABELS).reduce((acc,key)=>{
  acc[key] = key==="squat"?120 : key==="bench"?100 : key==="deadlift"?140 : key==="ohp"?60 : 0;
  return acc;
},{});

// ---------- Block templates (research-based, one method per lift) ----------

function frontSquatBlock(){

    name:"Front Squat", testType:"1rm", weeks:[
    {week:1,sets:4,reps:6,pct:0.65,style:"2s pause in the hole, controlled up"},
    {week:2,sets:4,reps:5,pct:0.70,style:"2s pause in the hole"},
    {week:3,sets:5,reps:3,pct:0.78,style:"No pause, drive hard out of the bottom"},
    {week:4,sets:5,reps:3,pct:0.82,style:"Reset the rack position every rep"},
    {week:5,sets:4,reps:2,pct:0.88,style:"Heavy doubles, stop if the elbows drop"},
    {week:6,sets:1,reps:1,pct:0.95,isTest:true,style:"Build to a max single"},
  ]};
}

    name:"Bench Press", testType:"1rm", weeks:[
    {week:1,sets:4,reps:6,pct:0.68,style:"1s pause on the chest every rep"},
    {week:2,sets:4,reps:5,pct:0.73,style:"1s pause on the chest"},
    {week:3,sets:5,reps:4,pct:0.78,style:"2s pause - hardest week for position"},
    {week:4,sets:4,reps:4,pct:0.80,style:"Touch-and-go, use the overload"},
    {week:5,sets:3,reps:2,pct:0.88,style:"Touch-and-go doubles, sharp lockout"},
    {week:6,sets:1,reps:1,pct:0.95,isTest:true,style:"Build to a max single"},
  ]};
}
function hipThrustBlock(){
  return { key:"hipThrust-ht-v2", label:"Double Progression", type:"barbell", lift:"hipThrust",
    name:"Hip Thrust", testType:"repMax", testReps:5, weeks:[
    {week:1,sets:4,reps:12,pct:0.60,style:"2s squeeze at lockout every rep"},
    {week:2,sets:4,reps:10,pct:0.66,style:"2s squeeze at lockout"},
    {week:3,sets:4,reps:8,pct:0.72,style:"Full lockout, ribs down"},
    {week:4,sets:4,reps:8,pct:0.76,style:"Add load only if all sets hit 8"},
    {week:5,sets:3,reps:6,pct:0.82,style:"Heavy, still full lockout"},
    {week:6,sets:1,reps:5,pct:0.85,isTest:true,style:"Test: heaviest clean set of 5"},
  ]};
}
function strictPressBlock(){
  return { key:"ohp-sp-v2", label:"Volume Accumulation", type:"barbell", lift:"ohp",
    name:"Strict Press", testType:"1rm", weeks:[
    {week:1,sets:5,reps:8,pct:0.62,style:"Strict - no leg drive, no layback"},
    {week:2,sets:5,reps:6,pct:0.68,style:"Strict, brace hard"},
    {week:3,sets:5,reps:5,pct:0.74,style:"Strict, full lockout overhead"},
    {week:4,sets:4,reps:4,pct:0.80,style:"Strict, reset each rep at the shoulder"},
    {week:5,sets:4,reps:2,pct:0.87,style:"Heavy doubles"},
    {week:6,sets:1,reps:1,pct:0.95,isTest:true,style:"Build to a max single"},
  ]};
}
function deadliftBlock(){
  return { key:"deadlift-dl-v2", label:"Cluster Loading", type:"barbell", lift:"deadlift",
    name:"Deadlift", testType:"1rm", weeks:[
    {week:1,sets:4,reps:5,pct:0.70,style:"Straight sets, dead stop each rep"},
    {week:2,sets:5,reps:3,pct:0.78,style:"Cluster: 3 reps, 20s rest, repeat"},
    {week:3,sets:5,reps:2,pct:0.83,style:"Cluster: 2 reps, 30s rest, repeat"},
    {week:4,sets:6,reps:2,pct:0.86,style:"Cluster: 2 reps, 30s rest - hardest week"},
    {week:5,sets:5,reps:1,pct:0.90,style:"Cluster singles, 30s rest between"},
    {week:6,sets:1,reps:1,pct:0.95,isTest:true,style:"Build to a max single"},
  ]};
}
function hspuSkillBlock(){
  return { key:"hspu-skill", label:"Gymnastics Skill Progression", type:"skill", name:"Handstand Push-up", weeks:[
    {week:1,prescription:"Wall-facing Handstand Hold 5 x 30-45s + Pike Push-up 4 x 8"},
    {week:2,prescription:"Wall-facing Handstand Hold 5 x 45-60s + Deficit Pike Push-up 4 x 10"},
    {week:3,prescription:"Kick-up to Handstand practice 8 attempts + Negative HSPU 4 x 3"},
    {week:4,prescription:"Strict HSPU singles/doubles with light assistance, 5 sets"},
    {week:5,prescription:"Strict HSPU 4 x 3-5 unbroken, minimal assistance"},
    {week:6,prescription:"Test: max unbroken strict Handstand Push-ups",isTest:true},
  ]};
}

const ACTIVE_BLOCKS = {
  Monday: frontSquatBlock(),
  Tuesday: benchBlock(),
  Wednesday: hipThrustBlock(),
  Thursday: strictPressBlock(),
  Friday: deadliftBlock(),
};

const STAGGER_VERSION = "v2";
const OFFSET_WEEKS_FROM_NOW = { Tuesday:1, Monday:2, Wednesday:3, Thursday:4, Friday:5 };

const ACCESSORY_PROGRAM = {
  Monday:{ exercises:[
    {id:"mon-2",name:"Straight Leg Deadlift (RDL)",type:"accessory",sets:4,reps:8,detail:"Moderate-heavy, control the stretch"},
    {id:"mon-3",name:"Standing Calf Raise",type:"accessory",sets:3,reps:15,detail:"Pause 1s at the top"},
  ]},
  Tuesday:{ exercises:[
    {id:"tue-2",name:"Weighted Pull-up",type:"accessory",sets:4,reps:7,detail:"Added load, full hang each rep"},
  ]},
  Wednesday:{ exercises:[
    {id:"wed-1",name:"Single Leg RDL",type:"accessory",sets:3,reps:10,detail:"Per leg, light-moderate DB"},
    {id:"wed-2",name:"Bulgarian Split Squat",type:"accessory",sets:3,reps:8,detail:"Per leg"},
  ]},
  Thursday:{ exercises:[
    {id:"thu-2",name:"DB Row",type:"accessory",sets:3,reps:10,detail:"Per side"},
    {id:"thu-3",name:"Lateral Raise",type:"accessory",sets:3,reps:14,detail:"Light, strict"},
  ]},
  Friday:{ exercises:[
    {id:"fri-2",name:"Heavy Farmers Carry",type:"accessory",sets:4,reps:40,repUnit:"m",detail:"Heavy, tall posture"},
    {id:"fri-3",name:"Hanging Knee Raise",type:"accessory",sets:3,reps:14,detail:"No swing",bodyweight:true},
  ]},
  Saturday:{ staticFocus:"Long Barbell Cycling", exercises:[
    {id:"sat-1",name:"Barbell Complex Cycling",type:"conditioning",
     detail:"Cycle without dropping the bar: 5 Deadlifts, 5 Hang Cleans, 5 Front Squats, 5 Push Press. Rest 90s, repeat for 6-8 rounds",
     cap:"Log rounds / total time"},
  ]},
  Sunday:{ staticFocus:"Rest", exercises:[] },
};

const ACCENT = "#E4572E", GOOD = "#7FB069";

// ============================================================
// Weight-relevance detection
// ============================================================
// Machines, runs and bodyweight gymnastics don't take a load, so their
// weight field is suppressed rather than showing an empty box to skip past.

const NO_WEIGHT_PATTERNS = [
  "run","running","row","rowing","erg","bike","bikeerg","assault bike","echo bike","ski","skierg",
  "swim","jump rope","double under","double-under","single under","skip",
  "burpee","push-up","pushup","push up","sit-up","situp","sit up","air squat","pistol",
  "pull-up","pullup","pull up","chin-up","chinup","toes-to-bar","toes to bar","t2b",
  "muscle-up","muscle up","handstand","hspu","ring dip","dip","box jump","box step",
  "mountain climber","plank","hollow","v-up","crunch","lunge walk","bear crawl",
  "sled push","sled pull","farmers carry","broad jump","tuck jump","star jump",
];

// These override the above - e.g. "weighted pull-up" DOES take load.
const FORCE_WEIGHT_PATTERNS = ["weighted","dumbbell","db ","kettlebell","kb ","barbell","loaded","goblet","wall ball","wallball","med ball","medicine ball","sandbag","plate"];

// A movement takes load unless it's a machine, a run, or bodyweight
// gymnastics - with an override list so "weighted pull-up" still asks for kg.
function needsWeight(name){
  if(!name) return true;
  const n = String(name).toLowerCase().trim();
  if(FORCE_WEIGHT_PATTERNS.some(f=>n.includes(f))) return true;
  if(NO_WEIGHT_PATTERNS.some(p=>n.includes(p))) return false;
  return true;
}

// ============================================================
// Storage + utility
// ============================================================

const STORE_PREFIX = "ironlog:";
async function loadKey(key, fallback){
  try{
    const raw = localStorage.getItem(STORE_PREFIX + key);
    return raw === null ? fallback : JSON.parse(raw);
  }catch{ return fallback; }
}
async function saveKey(key, value){
  try{ localStorage.setItem(STORE_PREFIX + key, JSON.stringify(value)); } catch{}
}

// Monotonic unique id. Date.now() alone collides when two entries are saved
// in the same millisecond, which would make delete-by-id remove both.
let _uidSeq = 0;
function uid(){ _uidSeq = (_uidSeq + 1) % 100000; return `${Date.now()}-${_uidSeq}`; }

function round25(n){ return Math.round(n/2.5)*2.5; }
function epley1RM(w,r){ return (!w||!r) ? 0 : w*(1+r/30); }
function todayName(){ return DAY_ORDER[(new Date().getDay()+6)%7]; }
function fmtDate(d){ return new Date(d).toLocaleDateString(undefined,{month:"short",day:"numeric"}); }
function esc(s){ const d=document.createElement('div'); d.textContent = s==null?"":String(s); return d.innerHTML; }
function escAttr(obj){ return esc(JSON.stringify(obj)).replace(/'/g,'&#39;'); }

// Training week runs Sunday 23:00 -> Sunday 23:00. Everything logged or saved
// inside that window belongs to the same week, so a missed Tuesday can be done
// Thursday and still count as that week's Tuesday session.
function weekBoundary(ref){
  const d = new Date(ref || Date.now());
  const b = new Date(d);
  b.setHours(23,0,0,0);
  // Step back to the most recent Sunday 23:00 that has already passed.
  const daysSinceSunday = b.getDay(); // Sun = 0
  b.setDate(b.getDate() - daysSinceSunday);
  if(b > d) b.setDate(b.getDate() - 7);
  return b;
}
function isThisTrainingWeek(dateISO){
  return new Date(dateISO) >= weekBoundary();
}

function startOfWeekSunday(d){
  const x = new Date(d); x.setHours(0,0,0,0);
  x.setDate(x.getDate() - x.getDay());
  return x;
}

function getSlotWeekInfo(day, slotState){
  const block = ACTIVE_BLOCKS[day];
  if(!block) return null;
  const state = slotState[day];
  const start = state ? state.startDate : new Date().toISOString();
  const msPerWeek = 7*24*60*60*1000;
  const weeksElapsed = Math.round((startOfWeekSunday(new Date()) - startOfWeekSunday(new Date(start))) / msPerWeek);
  const weekNumber = Math.max(1, weeksElapsed + 1);
  return { block, weekInBlock: Math.min(weekNumber,6), complete: weekNumber > 6 };
}

function buildPrimaryExercise(day, slotState){
  const info = getSlotWeekInfo(day, slotState);
  if(!info) return null;
  const { block, weekInBlock, complete } = info;
  const wk = block.weeks.find(w=>w.week===weekInBlock);
  const id = `${day}-primary-${block.key}`;
  const base = { id, name:block.name, blockLabel:block.label, weekInBlock, complete, isTest: !!wk.isTest,
                 style: wk.style || null, testType: block.testType || "1rm", testReps: block.testReps || null };
  if(block.type==="barbell") return { ...base, type:"strength", lift:block.lift, sets:wk.sets, reps:wk.reps, pct:wk.pct };
  return { ...base, type:"skill", prescription:wk.prescription };
}

function recommendedWeight(ex, oneRMs, logs){
  const lift = ex.lift;
  const increment = LIFT_INCREMENT[lift] || 2.5;
  if(ex.isTest && ex.testType !== "repMax") return round25((oneRMs[lift]||0)+increment);
  const base = round25((oneRMs[lift]||0)*ex.pct);
  const prior = logs.filter(l=>l.exerciseId===ex.id).sort((a,b)=>new Date(b.date)-new Date(a.date));
  const last = prior[0];
  if(!last) return base;
  if(last.reps === ex.reps && last.sets === ex.sets){
    return last.hitTarget ? round25(last.weight+increment) : round25(last.weight);
  }
  return base;
}

async function parseWodWithClaude(rawText){
  const response = await fetch("/api/parse-wod", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ rawText }),
  });
  if(!response.ok){
    let msg = "Request failed";
    try{ const e = await response.json(); if(e && e.error) msg = e.error; }catch{}
    throw new Error(msg);
  }
  return await response.json();
}

async function copyToClipboard(text){
  try{ if(navigator.clipboard && navigator.clipboard.writeText){ await navigator.clipboard.writeText(text); return true; } }catch{}
  try{
    const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.focus(); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    return true;
  }catch{ return false; }
}

// ---------- Formatting ----------

function setsSummary(sd){
  if(!sd || !sd.length) return "";
  const allSame = sd.every(s => s.reps===sd[0].reps && s.weight===sd[0].weight);
  if(allSame){
    return sd[0].weight ? `${sd.length} x ${sd[0].reps} @ ${sd[0].weight}kg` : `${sd.length} x ${sd[0].reps}`;
  }
  return sd.map(s => s.weight ? `${s.reps}@${s.weight}kg` : `${s.reps}`).join(", ");
}

function logLine(l){
  if(l.type==="strength" || l.type==="accessory"){
    if(l.setDetails && l.setDetails.length) return setsSummary(l.setDetails);
    return `${l.sets} x ${l.reps}${l.weight?` @ ${l.weight}kg`:""}`;
  }
  if(l.type==="conditioning"||l.type==="skill") return l.result || "No result logged";
  if(l.type==="customWod"){
    const moves = (l.movements||[]).map(m=>{
      const load = m.load ? ` @ ${m.load}kg` : "";
      return `${m.scheme?m.scheme+" ":""}${m.name}${load}`;
    }).join(", ");
    const body = moves || (l.rawText ? l.rawText.trim().split("\n").join(", ") : "");
    return `${l.format?l.format+" - ":""}${body}${body?" - ":""}${l.result||"No result logged"}`;
  }
  return l.result || "";
}
function logName(l){ return l.type==="customWod" ? l.title : l.exerciseName; }

// ---------- WHOOP export (per selected day, this training week) ----------

function whoopWodBlock(w){
  const lines = [];
  const head = w.format ? `${w.title} (${w.format}${w.timeCap?`, cap ${w.timeCap}`:""})` : w.title;
  lines.push(head);
  const moves = w.movements || [];
  if(moves.length){
    moves.forEach(m=>{
      const load = m.load ? ` @ ${m.load}kg` : "";
      lines.push(`  ${m.scheme ? m.scheme + " " : ""}${m.name}${load}`);
    });
  } else if(w.rawText && w.rawText.trim()){
    w.rawText.trim().split("\n").forEach(t=>{ if(t.trim()) lines.push(`  ${t.trim()}`); });
  }
  lines.push(`  Result: ${w.result || "completed"}`);
  return lines.join("\n");
}

function buildDayWhoopText(day, logs, journal, dayWod){
  const dayLogs = logs.filter(l => l.day===day && isThisTrainingWeek(l.date));
  const wod = dayWod && dayWod.result !== undefined ? dayWod : null;
  if(dayLogs.length===0 && !wod) return null;

  const lines = dayLogs.slice().reverse()
    .filter(l => l.type !== "customWod")
    .map(l => `${logName(l)} - ${logLine(l)}`);

  if(wod) lines.push(whoopWodBlock(wod));

  const jToday = journal.filter(j => j.day===day && isThisTrainingWeek(j.date));
  let text = `${day} Workout\n\n${lines.join("\n")}`;
  if(jToday.length) text += `\n\nNotes:\n${jToday.map(j=>j.text).join("\n")}`;
  return text.replace(/[\u2018\u2019]/g,"'").replace(/[\u201C\u201D]/g,'"')
             .replace(/[\u2013\u2014]/g,"-").replace(/\u00b7/g,"-").replace(/[^\x00-\x7F\n]/g,"");
}

async function init(){
  const [rms,l,j,p,storedSlotState,dayWods] = await Promise.all([
    loadKey("oneRMs", DEFAULT_ONE_RMS),
    loadKey("logs", []),
    loadKey("journal", []),
    loadKey("prs", []),
    loadKey("slotState", {}),
    loadKey("dayWods", {}),
  ]);
  STATE.oneRMs = { ...DEFAULT_ONE_RMS, ...rms };
  STATE.logs = l; STATE.journal = j; STATE.prs = p;

  // Drop any WOD saved before the current training week began.
  const boundary = weekBoundary();
  const freshWods = {};
  Object.entries(dayWods||{}).forEach(([day,w])=>{
    if(w && w.savedAt && new Date(w.savedAt) >= boundary) freshWods[day] = w;
  });
  STATE.dayWods = freshWods;
  if(Object.keys(freshWods).length !== Object.keys(dayWods||{}).length) saveKey("dayWods", freshWods);

  const nextSlotState = { ...storedSlotState };
  let changed = false;
  const msPerWeek = 7*24*60*60*1000;
  Object.keys(ACTIVE_BLOCKS).forEach(day=>{
    const currentKey = ACTIVE_BLOCKS[day].key;
    const stored = nextSlotState[day];
    const blockChanged = !stored || stored.blockKey !== currentKey;
    const staggerBump = !stored || stored.staggerVersion !== STAGGER_VERSION;
    if(!blockChanged && !staggerBump) return;
    let startDate;
    if(staggerBump && OFFSET_WEEKS_FROM_NOW[day] !== undefined){
      startDate = new Date(Date.now() - (6 - OFFSET_WEEKS_FROM_NOW[day])*msPerWeek).toISOString();
    } else {
      startDate = new Date().toISOString();
    }
    nextSlotState[day] = { blockKey: currentKey, startDate, staggerVersion: STAGGER_VERSION };
    changed = true;
  });
  if(changed) saveKey("slotState", nextSlotState);
  STATE.slotState = nextSlotState;
  STATE.loaded = true;
  render();
}

function persistLogs(next){ STATE.logs = next; saveKey("logs", next); }
function persistOneRMs(next){ STATE.oneRMs = next; saveKey("oneRMs", next); }
function persistJournal(next){ STATE.journal = next; saveKey("journal", next); }
function persistPrs(next){ STATE.prs = next; saveKey("prs", next); }
function persistDayWods(next){ STATE.dayWods = next; saveKey("dayWods", next); }

// Log a strength lift from per-set detail rows.
function logStrength(ex, setDetails){
  const valid = setDetails.filter(s => s.reps > 0);
  if(!valid.length) return false;
  const topWeight = Math.max(...valid.map(s=>s.weight||0));
  const topSet = valid.find(s => (s.weight||0) === topWeight) || valid[0];
  const hitTarget = valid.length >= ex.sets && valid.every(s => s.reps >= ex.reps);
  const logId = uid();
  const entry = {
    id: logId, date:new Date().toISOString(), day:STATE.selectedDay, type:"strength",
    exerciseId:ex.id, exerciseName:ex.name, lift:ex.lift,
    setDetails: valid, sets: valid.length, reps: ex.reps, weight: topWeight, hitTarget,
    isTest: ex.isTest||false,
  };
  persistLogs([entry, ...STATE.logs]);
  applyPrIfBeaten(logId, ex.lift, topWeight, topSet.reps, entry.date);
  return true;
}

// Raise the 1RM if this set beats it, recording both which log produced the
// PR and what the max was beforehand, so the change can be undone exactly if
// that log is later edited or deleted.
function applyPrIfBeaten(logId, lift, weight, reps, dateISO){
  if(!lift || !weight) return;
  const est = epley1RM(weight, reps);
  const prev = STATE.oneRMs[lift] || 0;
  if(est > prev){
    persistOneRMs({ ...STATE.oneRMs, [lift]: Math.round(est) });
    persistPrs([{ id:`${logId}-pr`, logId, date:dateISO, lift,
      estOneRM:Math.round(est), prevOneRM: prev, weight, reps }, ...STATE.prs]);
  }
}

// Strip any PR created by this log and restore the max that preceded it -
// but only if the current max is still the one that PR set, so a manually
// entered number is never silently overwritten.
function revertPrsForLog(logId){
  const doomed = STATE.prs.filter(p => p.logId === logId);
  if(!doomed.length) return;
  persistPrs(STATE.prs.filter(p => p.logId !== logId));
  const nextRMs = { ...STATE.oneRMs };
  doomed.forEach(d=>{
    if(Math.round(nextRMs[d.lift]) === Math.round(d.estOneRM)){
      nextRMs[d.lift] = Math.round(d.prevOneRM ?? nextRMs[d.lift]);
    }
  });
  persistOneRMs(nextRMs);
}

// Overwrite an existing log in place, keeping its position in history.
function updateSetLog(logId, ex, setDetails){
  const valid = setDetails.filter(s => s.reps > 0);
  if(!valid.length) return false;
  revertPrsForLog(logId);
  const topWeight = Math.max(...valid.map(s=>s.weight||0));
  const topSet = valid.find(s => (s.weight||0) === topWeight) || valid[0];
  const isStrength = ex.type === "strength";
  const next = STATE.logs.map(l => l.id !== logId ? l : {
    ...l,
    setDetails: valid,
    sets: valid.length,
    weight: topWeight || (isStrength ? 0 : null),
    hitTarget: valid.length >= ex.sets && valid.every(s => s.reps >= ex.reps),
    result: isStrength ? l.result : setsSummary(valid),
    editedAt: new Date().toISOString(),
  });
  persistLogs(next);
  if(isStrength) applyPrIfBeaten(logId, ex.lift, topWeight, topSet.reps, new Date().toISOString());
  return true;
}

function updateTextLog(logId, result){
  if(!result.trim()) return false;
  persistLogs(STATE.logs.map(l => l.id !== logId ? l : { ...l, result: result.trim(), editedAt:new Date().toISOString() }));
  return true;
}

function deleteLog(logId){
  revertPrsForLog(logId);
  persistLogs(STATE.logs.filter(l => l.id !== logId));
}

function logAccessory(ex, setDetails){
  const valid = setDetails.filter(s => s.reps > 0);
  if(!valid.length) return false;
  persistLogs([{
    id:uid(), date:new Date().toISOString(), day:STATE.selectedDay,
    exerciseId:ex.id, exerciseName:ex.name, type:"accessory",
    setDetails: valid, sets: valid.length, reps: ex.reps,
    weight: Math.max(...valid.map(s=>s.weight||0)) || null,
    result: setsSummary(valid),
  }, ...STATE.logs]);
  return true;
}

function logConditioning(ex, result){
  persistLogs([{ id:uid(), date:new Date().toISOString(), day:STATE.selectedDay,
    exerciseId:ex.id, exerciseName:ex.name, type:"conditioning", result }, ...STATE.logs]);
}
function logSkill(ex, result){
  persistLogs([{ id:uid(), date:new Date().toISOString(), day:STATE.selectedDay,
    exerciseId:ex.id, exerciseName:ex.name, type:"skill", result, isTest:ex.isTest||false }, ...STATE.logs]);
}
function update1RM(lift, value){
  const v = parseFloat(value);
  if(isNaN(v)) return;
  persistOneRMs({ ...STATE.oneRMs, [lift]: v });
}
function addJournal(text){
  if(!text.trim()) return;
  persistJournal([{ id:uid(), date:new Date().toISOString(), day:STATE.selectedDay, text }, ...STATE.journal]);
}

function render(){
  const root = document.getElementById('app');
  if(!STATE.loaded){
    root.innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:#8B8F96;font-size:13px;text-transform:uppercase;letter-spacing:0.1em;">Loading...</div>`;
    return;
  }
  root.innerHTML = `
    <header class="hdr"><div class="wrap">
      <div class="row">${iconSpan('flame',20,ACCENT)}<h1 class="disp">Iron Log</h1></div>
      <p>Hyrox strength &amp; conditioning</p>
    </div></header>
    <main><div class="wrap" id="main-content"></div></main>
    <nav class="tabbar"><div class="row">
      ${tabBtn('today','calendar','Today')}
      ${tabBtn('program','chevron','Program')}
      ${tabBtn('lifts','dumbbell','Lifts')}
      ${tabBtn('log','notebook','Log')}
    </div></nav>
  `;
  renderMain();
  document.querySelectorAll('[data-tab]').forEach(btn=>{
    btn.onclick = () => { STATE.tab = btn.dataset.tab; render(); };
  });
}

function tabBtn(id,icon,label){
  return `<button data-tab="${id}" class="${STATE.tab===id?'active':''}">${ICONS[icon]}<span>${label}</span></button>`;
}

function renderMain(){
  const el = document.getElementById('main-content');
  if(STATE.tab==="today"){ el.innerHTML = renderToday(); attachTodayHandlers(); }
  else if(STATE.tab==="program"){ el.innerHTML = renderProgram(); }
  else if(STATE.tab==="lifts"){ el.innerHTML = renderLifts(); attachLiftsHandlers(); }
  else if(STATE.tab==="log"){ el.innerHTML = renderLog(); attachLogHandlers(); }
}

// ---------- Today ----------

function renderToday(){
  const day = STATE.selectedDay;
  const dayData = ACCESSORY_PROGRAM[day];
  const primary = buildPrimaryExercise(day, STATE.slotState);
  const strengthEx = primary ? [primary, ...dayData.exercises] : dayData.exercises;
  const subtitle = primary
    ? `${esc(primary.name)} - Week ${primary.weekInBlock}/6 - ${esc(primary.blockLabel)}`
    : esc(dayData.staticFocus || "");

  let html = `<div class="pill-row">${DAY_ORDER.map(d=>
    `<button class="pill ${d===day?'active':''}" data-day="${d}">${d.slice(0,3)}</button>`
  ).join('')}</div>`;

  html += `<div style="margin-bottom:16px">
    <div class="disp" style="font-size:24px;text-transform:uppercase;font-weight:600">${day}</div>
    <div class="small accent">${subtitle}</div></div>`;

  if(primary && primary.complete){
    html += `<div class="card warn" style="display:flex;gap:8px;align-items:flex-start">
      ${iconSpan('refresh',15,ACCENT)}
      <div class="small"><span class="accent" style="font-weight:600">${day}'s block is complete.</span>
      Tell Claude in chat what to focus on next - your history stays in Log.</div></div>`;
  }

  // ----- Strength section -----
  const loggedIds = new Set(STATE.logs.filter(l=>isThisTrainingWeek(l.date)).map(l=>l.exerciseId));
  const doneCount = strengthEx.filter(e=>loggedIds.has(e.id)).length;
  html += section("strength", "Strength & Accessories",
    strengthEx.length ? `${doneCount}/${strengthEx.length} logged this week` : "Rest day",
    strengthEx.length === 0
      ? `<div class="card small muted" style="text-align:center">Rest day. Recover, hydrate, sleep.</div>`
      : strengthEx.map(ex =>
          ex.type==="strength" ? strengthCard(ex)
          : ex.type==="skill" ? skillCard(ex)
          : ex.type==="conditioning" ? conditioningCard(ex)
          : accessoryCard(ex)
        ).join('')
  );

  // ----- WOD section -----
  const saved = STATE.dayWods[day];
  const wodSub = saved ? esc(saved.title) : "None added";
  html += section("wod", "WOD", wodSub,
    (saved && !STATE.wodEditing) ? savedWodCard(day, saved) : wodEditor(day, saved));

  // ----- Copy button (always present) -----
  const copyText = buildDayWhoopText(day, STATE.logs, STATE.journal, STATE.dayWods[day]);
  html += `<div style="margin-top:24px;display:flex;flex-direction:column;align-items:center;gap:6px">
    <button class="btn-copy-sm" id="copy-whoop-btn" ${copyText?'':'disabled'}>
      ${ICONS.copy}<span id="copy-whoop-label">Copy ${day} for WHOOP</span></button>
    ${copyText ? '' : `<div class="xsmall muted">Log something to enable</div>`}
  </div>`;

  return html;
}

      <span class="chev ${open?'open':''}">${ICONS.chevron}</span>

function blockBadge(ex){

// Numeric input tuned for phones: decimal keypad, no spinner, no leading zero.
function numInput(cls, value, placeholder, extra){
  return `<input inputmode="decimal" class="tab-num numfield ${cls}" value="${value===null||value===undefined?'':value}"
    placeholder="${placeholder||''}" ${extra||''}/>`;
}

function setRows(ex, prefill, showWeight){
  let rows = `<div class="setrow head"><div></div>
    <div class="lbl">Reps</div>${showWeight?`<div class="lbl">Weight kg</div>`:`<div class="lbl">&nbsp;</div>`}</div>`;
  for(let i=0;i<ex.sets;i++){
    const p = prefill[i] || {};
    rows += `<div class="setrow" data-set="${i}">
      <div class="setno">${i+1}</div>
      ${numInput('f-reps', p.reps ?? ex.reps, '')}
      ${showWeight ? numInput('f-weight', p.weight ?? '', '-') : `<div class="xsmall muted" style="text-align:center">bodyweight</div>`}
    </div>`;
  }
  return rows;
}

function lastEntryFor(exId){
  return STATE.logs.filter(l=>l.exerciseId===exId).sort((a,b)=>new Date(b.date)-new Date(a.date))[0];
}
function loggedThisWeek(exId){
  return STATE.logs.find(l=>l.exerciseId===exId && isThisTrainingWeek(l.date));
}

function strengthCard(ex){
  const rec = recommendedWeight(ex, STATE.oneRMs, STATE.logs);
  const already = loggedThisWeek(ex.id);
  const last = already ? null : lastEntryFor(ex.id);
  const refLabel = ex.testType==="repMax" ? `${ex.testReps||5}RM` : "1RM";
  // When already logged, the rows show what was actually recorded so it can
  // be corrected in place; otherwise they show the prescription.
  const prefill = already && already.setDetails && already.setDetails.length
    ? already.setDetails
    : Array.from({length:ex.sets}, () => ({ reps: ex.reps, weight: rec }));
  const rowCount = already ? prefill.length : ex.sets;
  return `<div class="card ${ex.isTest?'test':''}" data-card="${ex.id}" data-extype="strength"
      data-exjson='${escAttr(ex)}' ${already?`data-logid="${already.id}"`:''}>
    <div style="display:flex;justify-content:space-between;align-items:flex-start">
      <div>
        <div class="disp" style="font-size:16px;font-weight:600">${esc(ex.name)}</div>
        <div class="xsmall muted" style="margin-top:2px">${ex.sets} x ${ex.reps} @ ${Math.round(ex.pct*100)}% of ${refLabel} - target ${rec}kg</div>
        ${ex.style ? `<div class="xsmall" style="margin-top:4px;color:#d6d3d1">${esc(ex.style)}</div>` : ''}
        ${blockBadge(ex)}
      </div>
      <span style="display:${already?'inline-flex':'none'}">${iconSpan('check',18,GOOD)}</span>
    </div>
    ${last ? `<div class="card sub" style="margin-top:10px"><div class="lbl">Last time</div>
      <div class="small" style="color:#d6d3d1;margin-top:2px">${esc(logLine(last))}</div></div>`:''}
    ${already ? `<div class="xsmall good" style="margin-top:10px">Logged ${fmtDate(already.date)}${already.editedAt?' (edited)':''} - adjust below to correct it</div>`:''}
    <div style="margin-top:12px">${setRows({...ex, sets:rowCount}, prefill, true)}</div>
    ${already
      ? `<div class="flex-gap">
           <button class="btn btn-primary update-sets-btn" style="flex:1">Update</button>
           <button class="btn btn-ghost delete-log-btn" style="flex:0 0 46px;padding:10px 0">${iconSpan('trash',14,'#8B8F96')}</button>
         </div>`
      : `<button class="btn btn-primary log-sets-btn">${ex.isTest ? 'Log Test' : 'Log Sets'}</button>`}
  </div>`;
}

function accessoryCard(ex){
  const already = loggedThisWeek(ex.id);
  const last = already ? null : lastEntryFor(ex.id);
  const showWeight = !ex.bodyweight && needsWeight(ex.name);
  const lastSets = last && last.setDetails ? last.setDetails : [];
  const prefill = already && already.setDetails && already.setDetails.length
    ? already.setDetails
    : Array.from({length:ex.sets}, (_,i) => ({
        reps: lastSets[i]?.reps ?? ex.reps,
        weight: lastSets[i]?.weight ?? (lastSets[0]?.weight ?? ''),
      }));
  const rowCount = already ? prefill.length : ex.sets;
  const unit = ex.repUnit || "";
  return `<div class="card" data-card="${ex.id}" data-extype="accessory"
      data-exjson='${escAttr(ex)}' ${already?`data-logid="${already.id}"`:''}>
    <div style="display:flex;justify-content:space-between;align-items:flex-start">
      <div>
        <div class="disp" style="font-size:16px;font-weight:600">${esc(ex.name)}</div>
        <div class="xsmall muted" style="margin-top:2px">Suggested ${ex.sets} x ${ex.reps}${unit}</div>
        <div class="small muted" style="margin-top:2px">${esc(ex.detail)}</div>
      </div>
      <span style="display:${already?'inline-flex':'none'}">${iconSpan('check',18,GOOD)}</span>

// Strip a leading zero as the user types (so "05" becomes "5"), while still
// permitting "0.5" and an empty field.
function wireNumFields(scope){
  (scope||document).querySelectorAll('.numfield').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      let v = inp.value.replace(/[^0-9.]/g,'');
      if(/^0[0-9]/.test(v)) v = v.replace(/^0+/,'');
      if(v.startsWith('.')) v = '0'+v;
      const parts = v.split('.');
      if(parts.length>2) v = parts[0]+'.'+parts.slice(1).join('');
      if(inp.value !== v) inp.value = v;
    });
  });
}

function readSetRows(card){
  return Array.from(card.querySelectorAll('.setrow[data-set]')).map(row=>({
    reps: parseFloat(row.querySelector('.f-reps')?.value) || 0,
    weight: parseFloat(row.querySelector('.f-weight')?.value) || 0,
  }));
}

    const ex = JSON.parse(card.dataset.exjson.replace(/&#39;/g,"'"));

      if(confirm(`Delete this ${ex.name} entry?`)){ deleteLog(logId); renderMain(); }
    };

function attachWodHandlers(){
  const day = STATE.selectedDay;
  const parseBtn = document.getElementById('wod-parse-btn');
  const rawEl = document.getElementById('wod-raw');
  const errEl = document.getElementById('wod-error');

  if(parseBtn && rawEl){
    parseBtn.onclick = async () => {
      const raw = rawEl.value;
      if(!raw.trim()) return;
      STATE.wodParsing = true;
      parseBtn.textContent = "Reading..."; parseBtn.disabled = true; errEl.textContent = '';
      try{
        const p = await parseWodWithClaude(raw);
        p.rawText = raw;
        p.movements = (p.movements||[]).map(m=>({ ...m, load: m.load ?? '' }));
        STATE.wodDraft = p;
        STATE.wodParsing = false;
        renderMain();
      }catch(e){
        STATE.wodParsing = false;
        errEl.textContent = (e.message||"Couldn't read that") + " - you can still save it as raw text.";
        parseBtn.textContent = "Read & Break Down"; parseBtn.disabled = false;
      }
    };
  }

  const skipBtn = document.getElementById('wod-skip-btn');
  if(skipBtn && rawEl){
    skipBtn.onclick = () => {
      if(!rawEl.value.trim()) return;
      saveDayWod(day, { title:"Custom WOD", format:null, timeCap:null, movements:[], rawText:rawEl.value, result:"" });
    };
  }

  const saveBtn = document.getElementById('wod-save-btn');
  if(saveBtn){
    saveBtn.onclick = () => {
      const d = STATE.wodDraft; if(!d) return;
      const moves = (d.movements||[]).map((m,i)=>{
        const row = document.querySelector(`.setrow[data-move="${i}"] .f-load`);
        return { ...m, load: row ? row.value : (m.load||'') };
      });
      const result = document.getElementById('wod-result')?.value || "";
      saveDayWod(day, { ...d, movements:moves, result });
    };
  }

  const editBtn = document.getElementById('wod-edit-btn');
  if(editBtn) editBtn.onclick = () => {
    const w = STATE.dayWods[day];
    STATE.wodDraft = w && (w.movements||[]).length ? { ...w } : null;
    STATE.wodEditing = true; renderMain();
  };
  const cancelBtn = document.getElementById('wod-cancel-edit');
  if(cancelBtn) cancelBtn.onclick = () => { STATE.wodEditing=false; STATE.wodDraft=null; renderMain(); };

  const clearBtn = document.getElementById('wod-clear-btn');
  if(clearBtn) clearBtn.onclick = () => {
    const next = { ...STATE.dayWods }; delete next[day];
    persistDayWods(next); STATE.wodDraft=null; STATE.wodEditing=false; renderMain();
  };

  const histBtn = document.getElementById('wod-history-btn');
  if(histBtn) histBtn.onclick = () => {
    const w = STATE.dayWods[day]; if(!w) return;
    persistLogs([{ id:uid(), date:new Date().toISOString(), day, type:"customWod",
      title:w.title, format:w.format, timeCap:w.timeCap, movements:w.movements,
      rawText:w.rawText, result:w.result }, ...STATE.logs]);
    persistDayWods({ ...STATE.dayWods, [day]: { ...w, savedToHistory:true } });
    renderMain();
  };
}

function saveDayWod(day, wod){
  persistDayWods({ ...STATE.dayWods, [day]: { ...wod, savedAt: new Date().toISOString(), savedToHistory:false } });
  STATE.wodDraft = null; STATE.wodEditing = false;
  renderMain();
}

function attachLogHandlers(){
  document.querySelectorAll('[data-logsub]').forEach(b=>{
    b.onclick = () => { STATE.logSubTab = b.dataset.logsub; renderMain(); };
  });
  if(STATE.logSubTab==="history"){
    const res = document.getElementById('log-results');
    const paint = () => {
      res.innerHTML = renderLogResults();
      res.querySelectorAll('.hist-del-btn').forEach(b=>{
        b.onclick = () => {
          const entry = STATE.logs.find(l=>l.id===b.dataset.logid);
          if(entry && confirm(`Delete this ${logName(entry)} entry?`)){ deleteLog(b.dataset.logid); paint(); }
        };
      });
    };
    paint();
    const s = document.getElementById('log-search');
    s.oninput = () => { STATE.logSearch = s.value; paint(); };
  } else {
    const add = document.getElementById('journal-add-btn');
    const inp = document.getElementById('journal-input');
    const go = () => { addJournal(inp.value); inp.value=''; renderMain(); };
    add.onclick = go;
    inp.onkeydown = (e) => { if(e.key==='Enter') go(); };
  }
}

init();
</script>
</body>
</html>
